   pharaonic jewellery, one ancient-pigment accent per region. Type is iOS-native (no downloads, works offline):
   Didot for display, Optima (inscriptional) for place names, Avenir Next for reading, Al Nile for Arabic. */

  --gold: #C9A14A; --gold-hi: #E9CD86; --gold-ink: #8A6516;
  --carnelian: #B0442A; --turquoise: #13868F; --malachite: #2B7A5C; --lapis: #2E54B4;
  --r-cairo: #B98A2B; --r-cairo-ink: #87621A; --d-cairo: #E2B85C;
  --r-alex: #2B7A5C;  --r-alex-ink: #226449;  --d-alex: #5CC198;
  --r-sharm: #13868F; --r-sharm-ink: #0E6D74; --d-sharm: #4CC6CC;
  --r-luxor: #B0442A; --r-luxor-ink: #9A3922; --d-luxor: #EE8A6A;
  --r-aswan: #2E54B4; --r-aswan-ink: #2A4CA3; --d-aswan: #8FA8F2;
  --rc: var(--gold); --rc-ink: var(--gold-ink); --rc-dot: var(--gold-hi);
  --sh-1: 0 1px 2px rgba(60,40,10,.05), 0 6px 18px -10px rgba(60,40,10,.22);
  --sh-2: 0 2px 6px rgba(60,40,10,.06), 0 24px 48px -24px rgba(40,25,5,.42);
  --f-display: Didot, "Bodoni 72", "Bodoni MT", "Playfair Display", "Times New Roman", serif;
  --f-inscr: Optima, "Optima Nova", Candara, "Segoe UI", "Gill Sans", sans-serif;
  --f-body: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Roboto, system-ui, sans-serif;
  --f-ar: "Al Nile", "Geeza Pro", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --stars: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27170%27%20height%3D%27170%27%20viewBox%3D%270%200%20170%20170%27%3E%3Cg%20fill%3D%27%23E9CD86%27%3E%3Cpath%20transform%3D%27translate(18%2022)%20scale(1)%27%20opacity%3D%270.55%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(70%2012)%20scale(0.7)%27%20opacity%3D%270.4%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(128%2030)%20scale(1.2)%27%20opacity%3D%270.6%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(44%2074)%20scale(0.8)%27%20opacity%3D%270.45%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(104%2086)%20scale(1)%27%20opacity%3D%270.5%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(150%20120)%20scale(0.7)%27%20opacity%3D%270.35%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(20%20132)%20scale(1.1)%27%20opacity%3D%270.55%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(84%20146)%20scale(0.75)%27%20opacity%3D%270.4%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(134%2066)%20scale(0.6)%27%20opacity%3D%270.3%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(60%20112)%20scale(0.6)%27%20opacity%3D%270.3%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(100%2040)%20scale(0.5)%27%20opacity%3D%270.25%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3Cpath%20transform%3D%27translate(156%20160)%20scale(0.9)%27%20opacity%3D%270.45%27%20d%3D%27M0-4L.65-.89%203.8-1.24%201.05.34%202.35%203.24%200%201.1-2.35%203.24-1.05.34-3.8-1.24-.65-.89Z%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  --frieze: repeating-linear-gradient(90deg, #2E54B4 0 11px, #E9CD86 11px 13px, #B0442A 13px 24px, #E9CD86 24px 26px, #13868F 26px 37px, #E9CD86 37px 39px);
  --tab-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A1129; --paper-2: #0E1734; --card: #121D40; --card-2: #16234B;
    --ink: #F3EAD6; --ink-2: #C9BEA6; --ink-3: #978D77; --line: #22325C; --line-2: #2E4074;
    --night: #070D21; --night-2: #101D42; --gold-ink: #E6C273;
    --r-cairo: #D9AE55; --r-cairo-ink: #E6C273; --r-alex: #4FB08A; --r-alex-ink: #6CC9A2;
    --r-sharm: #33AEB5; --r-sharm-ink: #5FCCD1; --r-luxor: #DA7556; --r-luxor-ink: #F09A7D;
    --r-aswan: #6F8FE6; --r-aswan-ink: #9DB4F4;
    --sh-1: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
    --sh-2: 0 2px 6px rgba(0,0,0,.3), 0 26px 50px -24px rgba(0,0,0,.85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0A1129; --paper-2: #0E1734; --card: #121D40; --card-2: #16234B;
  --ink: #F3EAD6; --ink-2: #C9BEA6; --ink-3: #978D77; --line: #22325C; --line-2: #2E4074;
  --night: #070D21; --night-2: #101D42; --gold-ink: #E6C273;
  --r-cairo: #D9AE55; --r-cairo-ink: #E6C273; --r-alex: #4FB08A; --r-alex-ink: #6CC9A2;
  --r-sharm: #33AEB5; --r-sharm-ink: #5FCCD1; --r-luxor: #DA7556; --r-luxor-ink: #F09A7D;
  --r-aswan: #6F8FE6; --r-aswan-ink: #9DB4F4;
  --sh-1: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
  --sh-2: 0 2px 6px rgba(0,0,0,.3), 0 26px 50px -24px rgba(0,0,0,.85);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16.5px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
img { display: block; max-width: 100%; }
img.broken { visibility: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--rc-ink); }
h1, h2, h3, h4 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
[hidden] { display: none !important; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.eyebrow { display: inline-block; font: 600 12px/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--rc-ink); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--rc-dot); flex: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; border: 1.5px solid transparent; font: 600 15px/1.15 var(--f-body); text-decoration: none;
  cursor: pointer; white-space: nowrap; transition: transform .12s ease, background-color .2s, border-color .2s; max-width: 100%;
}
.btn span { overflow: hidden; text-overflow: ellipsis; }
.btn:active { transform: scale(.97); }
.btn .ico { width: 19px; height: 19px; }
.btn-pri { background: var(--rc); color: #fff; }
:root[data-theme="dark"] .btn-pri { color: #0A1129; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-pri { color: #0A1129; } }
.btn-gold { background: linear-gradient(180deg, #F2DB9C, #CDA54F); color: #21180A; border-color: #E4C47A; }
.btn-ghost { background: var(--card); border-color: var(--line-2); color: var(--ink); }
.btn-glass { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.28); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.btn-sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn-sos { background: var(--carnelian); color: #fff; }
.btn[disabled] { opacity: .65; cursor: default; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; align-self: flex-start; }
.xbtn { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); cursor: pointer; }
.linkrow { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- app shell: mobile/tablet ---------- */
.app { min-height: 100vh; min-height: 100dvh; }
.rail { display: none; }
.topbar {
  position: sticky; top: 0; z-index: 30; color: var(--on-night);
  background: var(--stars), linear-gradient(180deg, var(--night-2), var(--night));
  padding-top: env(safe-area-inset-top);
}
.topbar::after { content: ""; display: block; height: 6px; background: var(--frieze); border-top: 1px solid var(--gold); }
.tb-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px max(16px, env(safe-area-inset-right)) 2px max(16px, env(safe-area-inset-left)); }
.brand { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; cursor: pointer; color: inherit; }
.wings { display: block; color: var(--gold-hi); }
.brand .wings { width: 46px; height: 18px; }
.brand-name { font-family: var(--f-display); font-size: 23px; letter-spacing: .26em; line-height: 1; text-transform: uppercase; padding-top: 3px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px;
  border: 1px solid rgba(233,205,134,.45); background: rgba(255,255,255,.06); color: var(--on-night);
  font: 600 14px var(--f-body); font-variant-numeric: tabular-nums lining-nums; cursor: pointer;
}
.pill .ico { width: 18px; height: 18px; color: var(--gold-hi); }
.pill .of { color: var(--on-night-2); font-weight: 500; }
.daystrip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding: 8px max(16px, env(safe-area-inset-left)) 12px; }
.daystrip::-webkit-scrollbar { display: none; }
.dchip {
  flex: none; scroll-snap-align: center; display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 8px;
  padding: 6px 12px 6px 9px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13);
  color: var(--on-night); cursor: pointer; text-align: left; line-height: 1.15;
}
.dchip .dnum { grid-row: span 2; font-family: var(--f-display); font-size: 25px; line-height: 1; min-width: 26px; text-align: center; font-variant-numeric: lining-nums; }
.dchip .dt1 { font: 600 10.5px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--on-night-2); }
.dchip .dt2 { font-size: 12.5px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.dchip .done { color: var(--gold-hi); font-weight: 700; }
.dchip[aria-selected="true"] { background: linear-gradient(180deg, #F2DB9C, #C9A14A); border-color: #F2DB9C; color: #21180A; box-shadow: 0 6px 16px -8px rgba(0,0,0,.6); }
.dchip[aria-selected="true"] .dt1 { color: #4A3712; }
.dchip[aria-selected="true"] .dot { background: #21180A; }
.dchip[aria-selected="true"] .done { color: #21180A; }
main { display: block; padding-bottom: calc(var(--tab-h) + 32px + env(safe-area-inset-bottom)); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; color: var(--on-night-2);
  background: rgba(11,19,44,.9); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid rgba(233,205,134,.3); padding-bottom: env(safe-area-inset-bottom);
}
.tabbar-row { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tab-h); max-width: 560px; margin: 0 auto; padding: 0 max(6px, env(safe-area-inset-left)); }
.tbtn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: inherit; font: 600 10.5px var(--f-body); letter-spacing: .04em; cursor: pointer; padding: 0; }
.tbtn .ico { width: 24px; height: 24px; }
.tbtn[aria-current="page"] { color: var(--gold-hi); }
.tbtn .badge { position: absolute; top: 7px; left: calc(50% + 7px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--carnelian); color: #fff; font: 700 10.5px/18px var(--f-body); text-align: center; }
.tbtn-ci { color: var(--gold-hi); }
.tbtn-ci .disc {
  width: 56px; height: 56px; margin-top: -24px; border-radius: 50%; display: grid; place-items: center; color: #1D1406;
  background: radial-gradient(circle at 35% 28%, #FBEAB8, #D4AD58 58%, #9E7728); box-shadow: 0 8px 20px rgba(0,0,0,.4), 0 0 0 4px rgba(11,19,44,.95);
}
.tbtn-ci .disc .ico { width: 27px; height: 27px; stroke-width: 1.9; }
.tbtn-ci:active .disc { transform: scale(.94); }

/* ---------- desktop: side rail ---------- */
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 304px minmax(0, 1fr); }
  .topbar, .tabbar { display: none; }
  main { padding-bottom: 56px; }
  .rail {
    display: block; position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; scrollbar-width: thin; color: var(--on-night);
    background:
      repeating-linear-gradient(180deg, #2E54B4 0 11px, #E9CD86 11px 13px, #B0442A 13px 24px, #E9CD86 24px 26px, #13868F 26px 37px, #E9CD86 37px 39px) right top / 6px 100% no-repeat,
      linear-gradient(var(--gold), var(--gold)) right 6px top / 1px 100% no-repeat,
      var(--stars), linear-gradient(180deg, var(--night-2), var(--night) 65%);
  }
}
.rail-in { display: flex; flex-direction: column; gap: 18px; padding: 30px 24px 28px 20px; min-height: 100%; }
.rail-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; background: none; border: 0; color: inherit; cursor: pointer; padding: 0 0 0 4px; text-align: left; }
.rail-brand .wings { width: 92px; height: 35px; }
.gilt { background: linear-gradient(180deg, #F8E7B2 12%, #D7B062 55%, #A57B27 96%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.rail-brand .name { font-family: var(--f-display); font-size: 40px; letter-spacing: .26em; line-height: 1; text-transform: uppercase; }
.rail-brand .dates { font-size: 13px; color: var(--on-night-2); letter-spacing: .03em; }
.rail-prog { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(233,205,134,.2); }
.ring { width: 56px; height: 56px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: rgba(255,255,255,.12); }
.ring .fg { stroke: var(--gold-hi); stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.rail-prog b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1; }
.rail-prog b span { font-family: var(--f-body); font-size: 14px; color: var(--on-night-2); }
.rail-prog small { font-size: 12.5px; color: var(--on-night-2); }
.rail-ci { width: 100%; }
.rail-nav { display: flex; flex-direction: column; gap: 2px; }
.rail-sec { font: 600 10.5px var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--gold-hi); opacity: .85; padding: 12px 10px 6px; }
.rlink { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border-radius: 12px; background: none; border: 0; color: var(--on-night); cursor: pointer; text-align: left; }
.rlink:hover { background: rgba(255,255,255,.06); }
.rlink[aria-current="page"] { background: rgba(233,205,134,.14); box-shadow: inset 3px 0 0 var(--gold-hi); }
.rlink > .ico { width: 21px; height: 21px; color: var(--gold-hi); margin: 0 9px 0 8px; }
.rlink .rnum { width: 38px; flex: none; text-align: center; line-height: 1; }
.rlink .rnum b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 23px; font-variant-numeric: lining-nums; }
.rlink .rnum small { font: 600 9.5px var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--on-night-2); }
.rlink .rtx { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.rlink .rtx b { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rlink .rtx span { font-size: 12px; color: var(--on-night-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.rlink .rprog { font: 600 11.5px var(--f-body); color: var(--on-night-2); font-variant-numeric: tabular-nums; }
.rlink .rprog .ico { width: 16px; height: 16px; color: var(--gold-hi); }
.rl-sos { color: #F3B3A0; }
.rl-sos > .ico { color: #F08A6C; }

/* ---------- day view ---------- */
.day { container-type: inline-size; }
.hero { position: relative; overflow: hidden; background: var(--stars), var(--night); color: #fff; min-height: 340px; height: 50vh; max-height: 480px; display: flex; align-items: flex-end; }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.78) saturate(1.05); }
.hero::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(6,11,28,.45) 0%, rgba(6,11,28,.2) 22%, rgba(6,11,28,.45) 42%, rgba(6,11,28,.8) 72%, rgba(6,11,28,.94) 100%); }
.hero-in { position: relative; z-index: 2; width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px 18px 52px; }
.hero-eyebrow { display: flex; align-items: center; gap: 8px; font: 600 12px var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: #F3E6C4; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
.hero-eyebrow .dot { width: 8px; height: 8px; }
.hero h1 { font-family: var(--f-display); font-size: clamp(34px, 9vw, 62px); line-height: 1.02; margin: 10px 0 16px; text-shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 30px rgba(0,0,0,.6); }
.hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.cart { position: relative; display: inline-flex; align-items: baseline; gap: 7px; padding: 3px 14px 5px; margin-right: 7px; border-radius: 999px; border: 1.5px solid currentColor; font-variant-numeric: lining-nums; white-space: nowrap; }
.cart::after { content: ""; position: absolute; right: -3.5px; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: currentColor; }
.cart b { font-family: var(--f-display); font-size: 21px; font-weight: 400; line-height: 1; }
.cart small { font: 600 10.5px var(--f-body); letter-spacing: .14em; text-transform: uppercase; }
.hero .cart { color: #F3E6C4; }
.cart.sm { padding: 2px 10px 3px; }
.cart.sm b { font-size: 17px; }
.hpill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.13); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 13.5px; color: #F7EFDD; white-space: nowrap; }
.hpill .ico { width: 16px; height: 16px; color: var(--gold-hi); }
.mbar { display: inline-block; width: 56px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; vertical-align: middle; }
.mbar i { display: block; height: 100%; border-radius: 3px; background: var(--gold-hi); transition: width .4s ease; }
.hero-credit { position: absolute; z-index: 3; right: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(6,11,28,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.hero-credit .ico { width: 16px; height: 16px; }
@container (min-width: 900px) {
  .hero { margin: 24px 32px 0; border-radius: 28px; min-height: 380px; height: 54vh; max-height: 520px; box-shadow: var(--sh-2); }
  .hero-in { padding: 28px 40px 60px; }
}

.day-grid { display: grid; gap: 18px; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.day-main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.day-side { display: none; flex-direction: column; gap: 14px; min-width: 0; }
@container (min-width: 900px) {
  .day-grid { grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; padding: 0 32px; align-items: start; }
  .day-side { display: flex; position: sticky; top: 24px; margin-top: 28px; max-height: calc(100vh - 48px); overflow: auto; scrollbar-width: thin; padding-bottom: 4px; }
  .side-mobile { display: none; }
}

.upnext {
  position: relative; z-index: 3; margin-top: -34px; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 2px 12px; align-items: center;
  padding: 12px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--sh-2);
}
.upnext .un-img { width: 58px; height: 58px; border-radius: 15px; object-fit: cover; background: var(--paper-2); }
.upnext .lbl { display: block; font: 600 11.5px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--rc-ink); }
.upnext .nm { display: block; font-family: var(--f-inscr); font-weight: 400; font-size: 18.5px; line-height: 1.2; }
.upnext .sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.upnext .acts { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; margin-top: 10px; }
.upnext.done { grid-template-columns: 48px minmax(0, 1fr); }
.upnext .seal { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--rc); color: #fff; }
.upnext.done .acts { grid-template-columns: 1fr; }
@container (min-width: 640px) {
  .upnext { grid-template-columns: 68px minmax(0, 1fr) auto; padding: 14px 16px 14px 14px; gap: 2px 16px; }
  .upnext .un-img { width: 68px; height: 68px; }
  .upnext .acts { grid-column: auto; display: flex; margin: 0; }
  .upnext.done { grid-template-columns: 48px minmax(0, 1fr) auto; }
}

.side-mobile { border-radius: 18px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.side-mobile > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; font-weight: 600; font-size: 15px; }
.side-mobile > summary::-webkit-details-marker { display: none; }
.side-mobile > summary .ico:first-child { color: var(--rc-ink); }
.side-mobile > summary span { flex: 1; }
.side-mobile > summary em { font-style: normal; color: var(--gold-ink); }
.side-mobile > summary .chev { transition: transform .2s; color: var(--ink-3); }
.side-mobile[open] > summary .chev { transform: rotate(180deg); }
.side-stack { display: flex; flex-direction: column; gap: 10px; padding: 0 10px 10px; }
.side-stack .side-card { background: var(--card-2); border-color: transparent; }

.side-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.5; }
.side-card h3 { font: 600 11.5px var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--rc-ink); display: flex; align-items: center; gap: 8px; }
.side-card h3 .ico { width: 18px; height: 18px; }
.optim { background: linear-gradient(145deg, rgba(201,161,74,.17), rgba(201,161,74,.02) 70%), var(--card); border-color: rgba(201,161,74,.55); }
.side-stack .optim { background: linear-gradient(145deg, rgba(201,161,74,.2), rgba(201,161,74,.03) 70%), var(--card-2); border-color: rgba(201,161,74,.4); }
.optim h3 { color: var(--gold-ink); }
.optim .saves { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.optim .saves small { font-family: var(--f-body); font-size: 13px; color: var(--ink-2); }
.optim ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 7px; }
.optim li::marker { color: var(--gold); }
.hotel-mini { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
.hotel-mini img, .hotel-mini .noimg { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--paper-2); }
.hotel-mini b { font-family: var(--f-inscr); font-weight: 400; font-size: 17px; display: block; line-height: 1.25; }
.hotel-mini p { font-size: 13.5px; line-height: 1.4; margin-top: 2px; }

/* timeline */
.tl { list-style: none; margin: 4px 0 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 15px; top: 16px; bottom: 16px; width: 2px; border-radius: 2px; background: linear-gradient(180deg, var(--rc), rgba(201,161,74,.15)); }
.tl > li { position: relative; padding-left: 42px; scroll-margin-top: 150px; }
.node { position: absolute; left: 0; top: 24px; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--rc); color: var(--rc-ink); }
.node .ico { width: 17px; height: 17px; }
.stop.done .node { background: var(--rc); color: #fff; }
:root[data-theme="dark"] .stop.done .node { color: #0A1129; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stop.done .node { color: #0A1129; } }
.node.pop { animation: popIn .4s cubic-bezier(.2,1.6,.4,1); }
.tl-time { display: none; }
.tl > li.stop, .tl > li.lunch-li, .tl > li.sect-li { padding-top: 6px; padding-bottom: 6px; }
.conn { display: flex; gap: 8px; padding-top: 6px; padding-bottom: 6px; font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.conn .cic { position: absolute; left: 5px; top: 6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); color: var(--ink-3); }
.conn .cic .ico { width: 15px; height: 15px; }
@container (min-width: 640px) {
  .tl::before { left: 99px; }
  .tl > li { padding-left: 136px; }
  .node { left: 81px; top: 22px; width: 38px; height: 38px; }
  .node .ico { width: 19px; height: 19px; }
  .conn .cic { left: 89px; }
  .tl-time { display: block; position: absolute; left: 0; top: 26px; width: 68px; text-align: right; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); }
  .tl-time b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 400; line-height: 1; }
  .tl-time small { font: 600 10.5px var(--f-body); letter-spacing: .16em; color: var(--ink-3); }
  .ctime { display: none; }
}

.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--sh-1); overflow: hidden; transition: border-color .25s; }
.stop.done .card { border-color: var(--rc); }
.chead { display: flex; align-items: center; }
.cmain { flex: 1; min-width: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 11px; align-items: center; padding: 10px 4px 10px 10px; background: none; border: 0; text-align: left; cursor: pointer; color: inherit; }
.thumb { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--stars), var(--night-2); }
.ctx { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ctime { font: 600 11.5px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--rc-ink); font-variant-numeric: lining-nums; }
.cname { font-family: var(--f-inscr); font-size: 17.5px; line-height: 1.22; }
.cmeta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13.5px; color: var(--ink-2); margin-top: 1px; }
.cmeta span { display: inline-flex; align-items: center; gap: 4px; }
.cmeta .ico { width: 14px; height: 14px; }
.cmeta .tnote { color: var(--rc-ink); font-weight: 600; }
.cmore { display: inline-flex; align-items: center; gap: 3px; font: 600 13px var(--f-body); color: var(--rc-ink); margin-top: 3px; }
.cmore .ico { width: 16px; height: 16px; transition: transform .2s; }
.cmain[aria-expanded="true"] .cmore .ico { transform: rotate(180deg); }
.ci {
  flex: none; margin-right: 10px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; gap: 7px;
  border: 1.5px dashed var(--rc); background: transparent; color: var(--rc-ink); cursor: pointer; transition: background-color .2s, transform .15s;
}
.ci .ico { width: 22px; height: 22px; }
.ci .lab { display: none; white-space: nowrap; }
.ci[aria-pressed="true"] { background: var(--rc); border-style: solid; color: #fff; }
:root[data-theme="dark"] .ci[aria-pressed="true"] { color: #0A1129; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ci[aria-pressed="true"] { color: #0A1129; } }
.ci:active { transform: scale(.92); }
@container (min-width: 640px) {
  .cmain { grid-template-columns: 96px minmax(0, 1fr); gap: 16px; }
  .thumb { width: 96px; height: 96px; }
  .ci { width: auto; height: 46px; margin-right: 12px; border-radius: 999px; padding: 0 16px 0 12px; display: inline-flex; font: 600 14.5px var(--f-body); }
  .ci .lab { display: inline; }
  .cname { font-size: 20px; }
}

.cbody { border-top: 1px solid var(--line); }
.cphoto { position: relative; margin: 0; background: var(--stars), var(--night-2); }
.cphoto img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.cap { position: absolute; right: 10px; bottom: 10px; max-width: calc(100% - 20px); font-size: 11.5px; color: #fff; text-decoration: none; background: rgba(8,12,28,.58); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 4px 10px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cgrid { display: grid; gap: 18px; padding: 16px; }
.cright, .cleft { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@container (min-width: 760px) {
  .cgrid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 26px; padding: 22px; }
  .cleft { grid-column: 1; grid-row: 1; }
  .cright { grid-column: 2; grid-row: 1; }
}
.fullname { font-family: var(--f-inscr); font-size: 15.5px; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: 15px; }
.facts dt { font: 600 11px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding-top: 3px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.copy-line { display: flex; gap: 6px; align-items: flex-start; }
.copy { border: 0; background: none; color: var(--rc-ink); padding: 0 2px; cursor: pointer; flex: none; }
.copy .ico { width: 17px; height: 17px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.books { display: flex; flex-direction: column; gap: 6px; }
.book { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(201,161,74,.5); background: rgba(201,161,74,.07); color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.4; }
.book .ico { color: var(--gold-ink); width: 19px; height: 19px; margin-top: 1px; }
.prose { display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
.prose h4, .sh { font: 600 11.5px var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--rc-ink); display: flex; align-items: center; gap: 8px; }
.prose h4 .ico, .sh .ico { width: 17px; height: 17px; }
.notecard { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); font-size: 15.5px; }
.notecard > .ico { color: var(--gold-ink); width: 21px; height: 21px; }
.notecard b { display: block; font-family: var(--f-inscr); font-weight: 400; font-size: 16.5px; margin-bottom: 2px; }
.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 15px; }
.tips li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; }
.tips li::before { content: ""; width: 6px; height: 6px; margin-top: 9px; transform: rotate(45deg); background: var(--gold); }
.stampz { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; border: 1.5px dashed var(--rc); background: var(--card-2); }
.stampz .art { width: 100px; height: 100px; flex: none; }
.stampz .art svg { width: 100%; height: 100%; display: block; }
.sz-tx { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; font-size: 14.5px; }
.sz-tx b { font-weight: 600; }
.sz-empty { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; font-size: 14.5px; color: var(--ink-2); }
.jl { display: flex; align-items: center; gap: 6px; font: 600 11px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.jl .ico { width: 15px; height: 15px; }
.journal { width: 100%; min-height: 64px; resize: vertical; border-radius: 12px; border: 1px solid var(--line-2); background: var(--paper); color: var(--ink); font: 16px/1.45 var(--f-body); padding: 9px 11px; }
.thunk { animation: thunk .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes thunk { 0% { transform: scale(1.8) rotate(var(--rot, -8deg)); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(var(--rot, -8deg)); } }
@keyframes popIn { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

.lunch { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed var(--line-2); font-size: 15px; color: var(--ink-2); }
.lunch > .ico { color: var(--rc-ink); width: 20px; height: 20px; margin-top: 1px; }
.lunch b { color: var(--ink); }
.node-sm { width: 26px; height: 26px; left: 3px; top: 16px; border-width: 1.5px; }
.node-sm .ico { width: 16px; height: 16px; }
@container (min-width: 640px) { .node-sm { left: 85px; width: 30px; height: 30px; } }
.sect { position: relative; border-radius: 20px; overflow: hidden; color: #fff; min-height: 190px; display: flex; align-items: flex-end; background: var(--stars), var(--night); }
.sect > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sect::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(6,11,28,.05), rgba(6,11,28,.88)); }
.sect-in { position: relative; z-index: 2; padding: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.sect .eyebrow { color: var(--gold-hi); }
.sect h2 { font-family: var(--f-display); font-size: 32px; line-height: 1.05; }
.sect p { font-size: 15px; color: #EDE5D2; }
.endnote { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; font-size: 15px; color: var(--ink-2); padding: 4px 4px 0; }
.endnote .ico { color: var(--rc-ink); }
.daynav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.daynav button { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-align: left; }
.daynav button.next { grid-column: 2; justify-content: flex-end; text-align: right; }
.daynav span { min-width: 0; display: flex; flex-direction: column; }
.daynav small { font: 600 10.5px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.daynav b { font-family: var(--f-inscr); font-weight: 400; font-size: 15px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.daynav .ico { color: var(--ink-3); }

/* ---------- overview ---------- */
.ov { container-type: inline-size; }
.ov-hero { position: relative; overflow: hidden; text-align: center; color: var(--on-night); background: var(--stars), radial-gradient(120% 90% at 50% 0%, #22397A 0%, var(--night) 64%); padding: 40px 20px 44px; }
.ov-hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--frieze); border-top: 1px solid var(--gold); }
.ov-wings { width: min(250px, 64vw); height: auto; margin: 0 auto; }
.ov-title { font-family: var(--f-display); font-size: clamp(64px, 20vw, 148px); line-height: .95; letter-spacing: .24em; margin: 12px -.24em 0 0; text-transform: uppercase; }
.ov-dates { font: 600 12.5px var(--f-body); letter-spacing: .22em; text-transform: uppercase; color: var(--gold-hi); margin-top: 14px; }
.route { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; margin: 16px auto 0; max-width: 620px; font-size: 14px; color: var(--on-night-2); }
.route span { display: inline-flex; align-items: center; gap: 10px; }
.route span + span::before { content: ""; width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold); }
.countdown { margin-top: 20px; font-family: var(--f-display); font-size: 23px; }
.countdown b { font-weight: 400; color: var(--gold-hi); }
.ov-hero .btn { margin-top: 14px; }
.ov-stats { display: flex; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.ov-stats > div { min-width: 92px; padding: 10px 14px; border-radius: 16px; border: 1px solid rgba(233,205,134,.28); background: rgba(255,255,255,.05); }
.ov-stats b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--gold-hi); }
.ov-stats span { font: 600 10.5px var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--on-night-2); }
.ov-body { max-width: 1200px; margin: 0 auto; padding: 26px 16px 0; display: flex; flex-direction: column; gap: 34px; }
@container (min-width: 900px) { .ov-body { padding: 36px 32px 0; gap: 44px; } .ov-hero { padding: 56px 32px 56px; } }
.sec-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sec-h h2 { font-family: var(--f-display); font-size: clamp(28px, 5.5vw, 38px); line-height: 1.04; margin-top: 4px; }
.optim-big { display: grid; gap: 18px; padding: 20px; border-radius: 24px; border: 1px solid rgba(201,161,74,.5); background: linear-gradient(145deg, rgba(201,161,74,.16), rgba(201,161,74,.02) 60%), var(--card); box-shadow: var(--sh-1); }
.optim-big h2 { font-family: var(--f-display); font-size: clamp(28px, 5.5vw, 38px); line-height: 1.05; margin: 4px 0 8px; }
.optim-big .eyebrow { color: var(--gold-ink); }
.optim-big ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.optim-big li button { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-align: left; font-size: 14.5px; line-height: 1.4; }
.optim-big li .cart { color: var(--rc-ink); margin-right: 8px; }
.optim-big li b { color: var(--gold-ink); font-weight: 700; }
@container (min-width: 900px) { .optim-big { grid-template-columns: 300px minmax(0, 1fr); padding: 28px; gap: 28px; } .optim-big ol { grid-template-columns: 1fr 1fr; } }
.dcards { display: grid; gap: 14px; grid-template-columns: 1fr; }
@container (min-width: 600px) { .dcards { grid-template-columns: 1fr 1fr; } .dcard:first-child, .dcard:last-child { grid-column: span 2; aspect-ratio: auto; min-height: 220px; } }
@container (min-width: 960px) { .dcards { grid-template-columns: repeat(3, 1fr); gap: 18px; } }
.dcard { position: relative; display: block; width: 100%; aspect-ratio: 16 / 11; border-radius: 22px; overflow: hidden; border: 0; padding: 0; background: var(--stars), var(--night); color: #fff; cursor: pointer; text-align: left; box-shadow: var(--sh-1); transition: transform .25s ease, box-shadow .25s; }
.dcard:hover { transform: translateY(-3px); box-shadow: var(--sh-2); }
.dcard > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.85); transition: transform .7s ease; }
.dcard:hover > img { transform: scale(1.05); }
.dcard::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(6,11,28,.25) 0%, rgba(6,11,28,0) 28%, rgba(6,11,28,.55) 62%, rgba(6,11,28,.9) 100%); }
.dcard-in { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 16px 18px 16px; display: flex; flex-direction: column; align-items: flex-start; }
.dcard .cart { color: #F3E6C4; }
.dcard h3 { font-family: var(--f-display); font-size: 25px; line-height: 1.08; margin: 10px 0 4px; text-shadow: 0 1px 14px rgba(0,0,0,.55); }
.dcard .sub { font-size: 13px; color: #E9E0CC; display: flex; align-items: center; gap: 8px; }
.dcard .bar { align-self: stretch; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); margin-top: 10px; overflow: hidden; }
.dcard .bar i { display: block; height: 100%; background: var(--gold-hi); }
.dcard .tag { position: absolute; top: 12px; left: 12px; z-index: 2; padding: 4px 10px; border-radius: 999px; background: var(--gold-hi); color: #21180A; font: 700 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; }
.two { display: grid; gap: 34px; }
@container (min-width: 900px) { .two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: start; } }
.checklist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.checklist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.checklist .cl { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: start; cursor: pointer; font-size: 15px; line-height: 1.4; }
.checklist input { width: 22px; height: 22px; margin: 0; accent-color: var(--malachite); }
.checklist .when { display: block; font-size: 12.5px; color: var(--ink-3); }
.checklist li.done .cl > span { color: var(--ink-3); text-decoration: line-through; }
.checklist a { font: 600 13.5px var(--f-body); color: var(--gold-ink); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.checklist a .ico { width: 15px; height: 15px; }
.checklist.slim { border-top: 0; }
.checklist.slim li { padding: 7px 0; border-bottom: 1px dashed var(--line); }
.checklist.slim li:last-child { border-bottom: 0; }
.hcards { display: flex; flex-direction: column; gap: 12px; }
.hcard { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 12px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.hcard > img, .hcard > .noimg { width: 92px; height: 92px; border-radius: 14px; object-fit: cover; background: var(--stars), var(--night-2); }
.hc-tx { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.hc-tx h3 { font-family: var(--f-inscr); font-size: 18px; line-height: 1.25; }
.hc-tx p { font-size: 14px; line-height: 1.45; }
.hc-tx .linkrow { margin-top: 6px; }
.bul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15.5px; }
.bul li::marker { color: var(--gold); }
.offline { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 16px; align-items: center; padding: 18px; border-radius: 22px; color: var(--on-night); background: var(--stars), linear-gradient(135deg, var(--night-2), var(--night)); }
.offline > .ico { width: 34px; height: 34px; color: var(--gold-hi); }
.offline h3 { font-family: var(--f-display); font-size: 26px; }
.offline p { color: var(--on-night-2); font-size: 14.5px; margin-top: 4px; }
.offline .btn { grid-column: 1 / -1; justify-self: start; }
@container (min-width: 760px) { .offline { grid-template-columns: auto minmax(0, 1fr) auto; padding: 22px 26px; } .offline .btn { grid-column: auto; } }

/* ---------- passport ---------- */
.pp { container-type: inline-size; }
.pp-in { max-width: 1200px; margin: 0 auto; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 18px; }
@container (min-width: 900px) { .pp-in { padding: 28px 32px 0; gap: 22px; } }
.pp-cover { position: relative; overflow: hidden; border-radius: 26px; color: var(--on-night); background: var(--stars), radial-gradient(120% 120% at 30% 0%, #233F82, var(--night) 70%); padding: 26px 22px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--sh-2); }
.pp-cover .wings { width: 110px; height: 42px; }
.pp-kicker { font: 600 11px var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--gold-hi); }
.pp-cover h1 { font-family: var(--f-display); font-size: clamp(38px, 9vw, 58px); letter-spacing: .2em; text-transform: uppercase; line-height: 1; }
.pp-cover .cnt { font-size: 15.5px; }
.pp-cover .cnt b { font-family: var(--f-display); font-weight: 400; font-size: 24px; color: var(--gold-hi); }
.pp-cover .mbar { width: min(320px, 100%); height: 6px; }
.pp-cover .hint { color: var(--on-night-2); font-size: 14px; }
.pp-pages { display: grid; gap: 14px; }
@container (min-width: 860px) { .pp-pages { grid-template-columns: 1fr 1fr; gap: 18px; } }
.pp-page { border-radius: 22px; padding: 16px; border: 1px solid var(--line); background: radial-gradient(circle at 100% 0%, rgba(201,161,74,.12), transparent 42%), var(--card); }
.pp-page h2 { display: flex; align-items: center; gap: 6px; font-family: var(--f-inscr); font-size: 18px; margin-bottom: 12px; color: var(--ink); }
.pp-page h2 .cart { color: var(--rc-ink); }
.pp-page h2 span:nth-child(2) { flex: 1; }
.pp-page h2 small { font: 600 12px var(--f-body); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
@container (min-width: 600px) { .pp-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; } }
.slot { position: relative; aspect-ratio: 1; border-radius: 16px; border: 1.5px dashed var(--line-2); display: grid; place-items: center; padding: 8px; background: transparent; cursor: pointer; font-size: 12.5px; line-height: 1.25; color: var(--ink-3); text-align: center; }
.slot.on { border-style: solid; border-color: transparent; background: var(--card-2); }
.slot .art, .slot .art svg { width: 100%; height: 100%; display: block; }
.slot .has-note { position: absolute; right: 6px; bottom: 6px; color: var(--ink-3); }
.slot .has-note .ico { width: 15px; height: 15px; }

/* ---------- sheets, driver card, toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(5,9,22,.52); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade .2s ease; }
.sheet { position: fixed; z-index: 61; left: 0; right: 0; bottom: 0; max-height: 90vh; max-height: 90dvh; display: flex; flex-direction: column; background: var(--paper); border-radius: 24px 24px 0 0; box-shadow: 0 -14px 50px rgba(0,0,0,.35); padding-bottom: env(safe-area-inset-bottom); animation: up .34s cubic-bezier(.2,.9,.25,1); container-type: inline-size; }
.sheet-grip { width: 42px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 9px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 18px 8px; flex: none; }
.sheet-head h2 { font-family: var(--f-display); font-size: 30px; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 18px 26px; display: flex; flex-direction: column; gap: 22px; }
@media (min-width: 768px) {
  .sheet { left: 50%; right: auto; top: 50%; bottom: auto; width: min(640px, 92vw); max-height: 86vh; border-radius: 26px; transform: translate(-50%, -50%); animation: pop .26s cubic-bezier(.2,.9,.25,1); padding-bottom: 0; }
  .sheet-grip { display: none; }
  .sheet-head { padding: 18px 22px 8px; }
  .sheet-body { padding: 4px 22px 26px; }
}
@media (min-width: 1024px) { .sheet { left: calc(50% + 152px); } }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -47%) scale(.98); } to { opacity: 1; transform: translate(-50%, -50%); } }
@keyframes fade { from { opacity: 0; } }
.near { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 18px; border: 1px solid rgba(201,161,74,.5); background: linear-gradient(145deg, rgba(201,161,74,.14), transparent 70%), var(--card); }
.near-head { display: flex; align-items: center; gap: 12px; }
.near-head > div { flex: 1; min-width: 0; }
.near-head b { font-family: var(--f-inscr); font-weight: 400; font-size: 19px; }
.geo-err { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; font-size: 14px; color: var(--ink-2); }
.cilist { display: flex; flex-direction: column; gap: 8px; }
.cirow { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 8px 8px 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.cirow > img, .cirow > .noimg { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: var(--stars), var(--night-2); }
.cirow .tx { min-width: 0; display: flex; flex-direction: column; }
.cirow .nm { font-family: var(--f-inscr); font-size: 16.5px; line-height: 1.2; }
.cirow .sub { font-size: 12.5px; color: var(--ink-2); }
.cirow .sub b { color: var(--rc-ink); }
.cirow.here { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,161,74,.25); }
.cirow .ci { margin-right: 0; width: 46px; height: 46px; }
.cirow .ci .lab { display: none; }
.ci-day { display: flex; flex-direction: column; gap: 10px; }
.ci-day-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ci-day-head b { font-family: var(--f-inscr); font-weight: 400; font-size: 19px; }
.daysel { max-width: 62%; min-height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); padding: 0 10px; font-size: 15px; }
.sos-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sos-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.sos-list .lbl { display: block; font-size: 13.5px; color: var(--ink-2); }
.sos-list .num { font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: lining-nums; user-select: all; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 12px; background: var(--paper-2); border: 1px solid var(--line); }
.seg button { border: 0; border-radius: 9px; padding: 8px 14px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14px; cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: var(--sh-1); }
.credits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); }
.credits a { color: var(--ink-2); }

.driver { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; color: var(--on-night); background: var(--stars), radial-gradient(120% 80% at 50% 0%, #22397A, var(--night) 70%); padding: calc(16px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom)); animation: fade .2s; }
.driver .xbtn { align-self: flex-end; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; }
.driver-in { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; max-width: 900px; margin: 0 auto; }
.driver .ask { font-family: var(--f-ar); font-size: 24px; color: var(--gold-hi); }
.driver .ar { font-family: var(--f-ar); font-size: clamp(40px, 11vw, 88px); line-height: 1.5; font-weight: 700; text-wrap: balance; }
.driver .en { font-family: var(--f-inscr); font-size: 18px; color: var(--on-night-2); }
.driver-foot { text-align: center; font-size: 13px; color: var(--on-night-2); }

.toast { position: fixed; z-index: 80; left: 50%; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; width: max-content; max-width: calc(100vw - 32px); padding: 9px 9px 9px 14px; border-radius: 16px; background: #141C38; color: #F6EEDC; box-shadow: 0 14px 34px rgba(0,0,0,.38); font: 600 14.5px var(--f-body); animation: toastIn .25s ease; }
.toast .ico { color: var(--gold-hi); }
.toast .msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { flex: none; border: 0; background: rgba(233,205,134,.16); color: var(--gold-hi); font: 700 13.5px var(--f-body); padding: 7px 12px; border-radius: 10px; cursor: pointer; }
@media (min-width: 1024px) { .toast { bottom: 28px; left: calc(50% + 152px); } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (min-width: 1024px) { .tl > li { scroll-margin-top: 24px; } }
@media print { .topbar, .tabbar, .rail, .upnext, .ci { display: none !important; } }

story":"Open continuously since 1773 — the oldest café in Cairo, mirrored walls, brass-topped tables, a regular haunt of Naguib Mahfouz.","history2":null,"more":"Nobel laureate Naguib Mahfouz (Nobel Prize 1988) was a regular, and Khan el-Khalili gave its name to one of his early novels. Ask for the menu before ordering; prices for tourists can be steep.","fact":"It has reportedly never closed its doors, not even for a single day, since it opened in the late 18th century.","photoTip":"The mirrored back wall, shot through the brass lanterns hanging overhead.","mustTry":"Mint tea, Arabic coffee or a shisha: the café's three classics.","tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJGbglAGA_WBQR0Ykz7VIRwq8","query":"El-Fishawy Café, Cairo, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/Cairo_FishawyCaf%C3%A91_byDanielCsorfoly.JPG/{w}px-Cairo_FishawyCaf%C3%A91_byDanielCsorfoly.JPG","o":"https://upload.wikimedia.org/wikipedia/commons/b/b7/Cairo_FishawyCaf%C3%A91_byDanielCsorfoly.JPG","w":1656,"h":1242,"by":"Daniel Csörföly","lic":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Cairo_FishawyCaf%C3%A91_byDanielCsorfoly.JPG","cap":""},"lat":30.04746,"lng":31.26226,"ar":"مقهى الفيشاوي – خان الخليلي","plan":"6:20 PM","title":"El-Fishawy Café","timeNote":null},{"type":"stop","id":"dec27-khan-el-khalili-bazaar-al-muizz-street","kind":"market","short":"Khan el-Khalili","name":"Khan El-Khalili Bazaar & Al-Muizz Street","address":"El-Gamaleya, Cairo","getTo":"You're already in it: browse the bazaar, then walk north up Al-Muizz Street, which is lit up at night.","recTime":"2–3 hours","hours":null,"history":"One of the Middle East's oldest trading markets, founded in 1382 by Amir Jaharkas el-Khalili on the site of a former Fatimid-era cemetery. Al-Muizz Street, its spine, is lined with minarets and merchant houses spanning the 10th–14th centuries and is lit beautifully after dark — the main reason to walk it at night rather than midday.","history2":null,"more":"Al-Muizz Street is named for the Fatimid caliph al-Mu'izz li-Din Allah, whose general Jawhar founded Cairo in 969 CE. It was the ceremonial spine of the walled Fatimid city, running from Bab al-Futuh in the north to Bab Zuweila in the south. Historic Cairo has been a UNESCO World Heritage Site since 1979, and this one street holds one of the densest groups of medieval Islamic monuments anywhere, including the Qalawun complex (1285) with its hospital, madrasa and mausoleum.","fact":"You can walk a single kilometer here and pass through Fatimid, Mamluk, and Ottoman architecture back to back — almost nowhere else in the world stacks that much continuous urban history into one walkable street.","photoTip":"Shoot down Al-Muizz St. from the Bab Zuweila gate end — the minarets line up in forced perspective.","mustTry":null,"tips":["Haggle everywhere; start at about a third of the first price.","Most shops close around 11 PM."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJD1gOLOtAWBQREX0CYeTgYRc","query":"Khan El-Khalili Bazaar & Al-Muizz Street, Cairo, Egypt","primary":true},{"label":"Al-Muizz Street","placeId":"ChIJIbGLO55AWBQRUPFbip1Ic5M","query":"Al Muizz Street Cairo"}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/%D8%AE%D8%A7%D9%86_%D8%A7%D9%84%D8%AE%D9%84%D9%8A%D9%84%D9%8A_1.jpg/{w}px-%D8%AE%D8%A7%D9%86_%D8%A7%D9%84%D8%AE%D9%84%D9%8A%D9%84%D9%8A_1.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/7/74/%D8%AE%D8%A7%D9%86_%D8%A7%D9%84%D8%AE%D9%84%D9%8A%D9%84%D9%8A_1.jpg","w":3840,"h":2312,"by":"Heba otefy","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:%D8%AE%D8%A7%D9%86_%D8%A7%D9%84%D8%AE%D9%84%D9%8A%D9%84%D9%8A_1.jpg","cap":""},"lat":30.0475,"lng":31.2622,"ar":"خان الخليلي وشارع المعز","plan":"7:00 PM","title":"Khan el-Khalili & Al-Muizz Street","timeNote":null},{"type":"dinner","id":"dec27-zeeyara","kind":"food","short":"Zeeyara","name":"Zeeyara","address":"114 Al-Muizz Street (in front of Bayt Al-Suhaymi), El Gamaliya, Cairo","getTo":"The walk ends here, at the north end of Al-Muizz Street in front of Bayt al-Suhaymi. No backtracking.","recTime":null,"hours":null,"history":"The \"locals' favorite\" from your draft: a rooftop restaurant facing Bayt Al-Suhaymi, a restored 17th-century Ottoman merchant's house, with a terrace view straight down onto the lit-up medieval street. Traditional Egyptian home cooking.","history2":null,"more":"Bayt Al-Suhaymi, across the street, is a merchant's mansion begun in 1648 and expanded in 1796. Its courtyard, wooden mashrabiya screens and cool reception halls show how wealthy Ottoman-era Cairenes lived.","fact":null,"photoTip":null,"mustTry":"Stuffed vine leaves (warak enab) and a beef or lamb tagine; the duck feteer is a strong starter.","tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJu7w5ZCxBWBQRu1qGUsu_cb8","query":"Zeeyara, Cairo, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Muizz_Street_-_Egypt.jpg/{w}px-Muizz_Street_-_Egypt.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/1/1f/Muizz_Street_-_Egypt.jpg","w":5682,"h":4000,"by":"Mohammed Moussa","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Muizz_Street_-_Egypt.jpg","cap":"Al-Muizz Street at night"},"lat":30.05219,"lng":31.26182,"ar":"مطعم زيارة – شارع المعز، أمام بيت السحيمي","plan":"9:00 PM","title":"Zeeyara","timeNote":null}],"transport":"Book a private airport transfer that waits for you (GetTransfer \"hourly\" or your hotel): airport → Khan el-Khalili (~35–45 min); the driver keeps your bags, then takes you on to the Mena House (~45 min). Avoid unmetered taxi touts inside the terminal.","walking":"~2 km, flat","pacing":"You land at 3:55 PM; allow ~1 hr for visa, immigration and bags. Prefer to drop bags at the hotel first? Add ~1.5 hrs and start the bazaar around 7:30 PM.","places":[{"label":"Cairo International Airport","placeId":"ChIJQU-oLggXWBQRhhPiUSGvZeA","query":"Cairo International Airport, Egypt"}],"hotelInfo":{"name":"Marriott Mena House","city":"Giza","placeId":"ChIJJTcLq4VFWBQRss6Y4MGJSVw","query":"Marriott Mena House Cairo","phone":"+20 2 33773222","note":"Former royal hunting lodge (1869) at the foot of the Pyramids. Ask for a Pyramid View room.","ar":"فندق ماريوت مينا هاوس – الهرم","lat":29.98556,"lng":31.13278,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/The_Oberoi_-_Mena_House%2C_Egypt.jpg/{w}px-The_Oberoi_-_Mena_House%2C_Egypt.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/4/4e/The_Oberoi_-_Mena_House%2C_Egypt.jpg","w":1536,"h":1024,"by":"Paul Mannix","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:The_Oberoi_-_Mena_House,_Egypt.jpg","cap":""}},"hero":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Muizz_Street_-_Egypt.jpg/{w}px-Muizz_Street_-_Egypt.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/1/1f/Muizz_Street_-_Egypt.jpg","w":5682,"h":4000,"by":"Mohammed Moussa","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Muizz_Street_-_Egypt.jpg","cap":"Al-Muizz Street at night"},"saves":"~1.5 h","optimized":["Straight from the airport to the old city, with your driver keeping the bags, instead of Giza and back. Saves ~1.5 hrs of Cairo traffic.","One walk south → north: feteer, tea at El-Fishawy, the bazaar, Al-Muizz Street, and dinner where the walk ends. No doubling back."]},{"id":"dec28","dow":"Mon","date":"Dec 28","full":"Monday, December 28, 2026","city":"Giza","region":"cairo","title":"Pyramids, the GEM & Coptic Cairo","hotel":"menaHouse","links":[{"label":"Uber","url":"https://www.uber.com/eg/en/"},{"label":"Careem","url":"https://www.careem.com/"}],"endNote":"Taxi back to the hotel, ~30–40 min from Downtown to Giza.","items":[{"type":"stop","id":"dec28-giza-plateau-great-pyramid-of-khufu-khaf","kind":"pyramid","short":"Giza","name":"Giza Plateau: Great Pyramid of Khufu, Khafre & Menkaure Pyramids, The Great Sphinx","address":"Al Haram, Giza","getTo":"Taxi/Uber/Careem from hotel to the plateau's main gate, ~15–30 min.","recTime":"2.5–3 hours","hours":"Plateau 7 AM – 5 PM; Sphinx area until 4 PM","history":"Built c. 2560 BCE for Pharaoh Khufu, the Great Pyramid was the tallest man-made structure on Earth for roughly 3,800 years. How 2.3 million limestone blocks were moved and raised is still debated — leading theories involve wetted sand to reduce ramp friction, and internal spiral ramps. The Great Sphinx, carved from a single limestone outcrop, is widely believed to bear the face of Khafre; its missing nose is natural erosion/early vandalism, not Napoleon's cannons as the popular myth claims.","history2":null,"more":"The three main pyramids belong to Khufu, his son Khafre and Khafre's successor Menkaure, all of the Fourth Dynasty (c. 2600–2500 BCE). Khafre's looks taller because it stands on higher bedrock and still keeps a cap of its original smooth limestone casing. The Great Pyramid is the only one of the Seven Wonders of the Ancient World still standing. The builders were paid workers housed in a town excavated south of the plateau, with bakeries and their own tombs; they were not slaves. Between the Sphinx's paws stands the Dream Stela of Thutmose IV (c. 1400 BCE), who wrote that the Sphinx promised him the throne if he cleared away the sand burying it.","fact":"The Great Pyramid's base is level to within about 2.1 cm across its entire 230m footprint, built with no modern surveying tools.","photoTip":"The classic \"all three pyramids in one frame\" shot is from the panorama viewpoint road on the plateau's south side.","mustTry":null,"tips":["Agree on camel or horse prices before mounting; pay at the end.","Inside Khufu's pyramid it is hot, steep and narrow."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJGymPrIdFWBQRJCSloj8vDIE","query":"Pyramids of Giza, Giza, Egypt","primary":true},{"label":"Great Sphinx","placeId":"ChIJeamuo2JPWBQRqb1mQKbw08k","query":"Great Sphinx of Giza"}],"bookings":[{"label":"General plateau admission plus a separate interior-entry ticket for Khufu's pyramid (limited daily slots, sells out) — egymonuments.com","url":"https://egymonuments.com/"},{"label":"Or a guided Giza package (guide, entry and camel ride) — Viator or GetYourGuide","url":"https://www.getyourguide.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/All_Gizah_Pyramids.jpg/{w}px-All_Gizah_Pyramids.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/a/af/All_Gizah_Pyramids.jpg","w":4372,"h":2906,"by":"Ricardo Liberato","lic":"CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:All_Gizah_Pyramids.jpg","cap":""},"lat":29.97611,"lng":31.13278,"ar":"أهرامات الجيزة","plan":"7:00 AM","title":"Giza Pyramids & the Great Sphinx","timeNote":"Gates open 7–8 AM in winter"},{"type":"stop","kind":"desert","short":"Camel ride","name":"Camel ride to the Panorama Point","photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Camel_riding_at_the_Giza_Pyramids_in_Egypt.JPG/{w}px-Camel_riding_at_the_Giza_Pyramids_in_Egypt.JPG","o":"https://upload.wikimedia.org/wikipedia/commons/9/96/Camel_riding_at_the_Giza_Pyramids_in_Egypt.JPG","w":3920,"h":2204,"by":"Dak15","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Camel_riding_at_the_Giza_Pyramids_in_Egypt.JPG","cap":""},"lat":29.96788,"lng":31.125,"ar":"منطقة البانوراما – أهرامات الجيزة","plan":"9:15 AM","timeNote":"Agree the price first","address":"Panorama viewpoint, south-west side of the Giza Plateau","getTo":"Camel handlers wait by the pyramids and at the Panorama Point; ride out across the sand to the viewpoint.","recTime":"30–45 min","hours":"Within plateau hours","history":"A camel ride at the pyramids has been part of an Egypt trip since Thomas Cook's first Nile tours in 1869, when travelers posed on camelback for the photographers who worked the plateau.","more":"The Panorama Point sits on a rise south-west of the pyramids. From here Khufu, Khafre and Menkaure line up across the desert with the small queens' pyramids in front of them: the classic view that doesn't fit in any frame up close.","fact":"Camels played no part in building the pyramids: they only became common in Egypt well over a thousand years later. The builders moved stone with sledges, ramps, donkeys and Nile boats.","photoTip":"Have someone shoot you on the camel with all three pyramids lined up behind; the light is best before 10 AM.","mustTry":null,"tips":["Agree on the price, the duration and the route before you mount, and pay at the end (cash, small notes).","30–45 minutes is plenty; ask for the Panorama Point.","Rather skip the haggling? A guided Giza package can include the ride."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":null,"query":"Giza Pyramids Panorama Point, Giza, Egypt","primary":true}],"bookings":[],"stampable":true,"id":"dec28-camel-ride-panorama","title":"Camel ride to the Panorama Point"},{"type":"stop","id":"dec28-grand-egyptian-museum-gem","kind":"museum","short":"GEM","name":"Grand Egyptian Museum (GEM)","address":"Giza, adjacent to the plateau","getTo":"~15-min drive from the Panorama Point. With a 10:30–11 AM slot the pyramids aren't rushed.","recTime":"3.5 hours, with lunch inside","hours":"9 AM – 6 PM (Wed & Sat until 9 PM)","history":"Opened fully in Nov 2025, GEM displays Tutankhamun's entire 5,000+ object collection together for the first time since its 1922 discovery. The Grand Staircase arranges statues chronologically by dynasty as you ascend; a colossus of Ramesses II anchors the main atrium.","history2":null,"more":"The building, by Heneghan Peng Architects, sits 2 km from the Pyramids and lines up with them along a sight axis. The 11 m, 83-ton granite Ramesses II that greets you stood in Ramses Square in central Cairo from 1955 until 2006, when it was moved out of the traffic fumes. The museum also holds Khufu's 4,500-year-old cedar solar boat, moved here in 2021.","fact":"It took nearly two decades to move and conserve Tutankhamun's treasures alone from the old Egyptian Museum downtown.","photoTip":"The Ramesses II colossus framed against the Grand Staircase glass wall, shot from ground level looking up.","mustTry":null,"tips":["See the Tutankhamun galleries first, before the tour groups arrive.","Tickets are timed; arrive 15 minutes early for security.","Hire a guide: book a licensed Egyptologist, or a guided tour with your GEM ticket if offered. The Tutankhamun galleries are far richer with one.","Suggested route: Grand Hall (Ramesses II) → up the Grand Staircase through 3,000 years of royal statues → Tutankhamun galleries first (allow ~1.5 hrs) → main galleries as time allows → Khufu's solar boat → lunch at Zööba.","Leave by ~2:15 PM for Coptic Cairo: doing the Tutankhamun galleries first makes that easy."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJ0YpKmDRFWBQRGibsxFtMdkU","query":"Grand Egyptian Museum, Giza, Egypt","primary":true}],"bookings":[{"label":"Mandatory advance booking — on-site purchase was discontinued Dec 2025 — tickets.gem.eg (official)","url":"https://tickets.gem.eg/"},{"label":"Museum guide: a licensed Egyptologist, or a guided tour with your ticket — tickets.gem.eg","url":"https://tickets.gem.eg/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/GEM_staircase_at_night_with_visitors_2025.jpg/{w}px-GEM_staircase_at_night_with_visitors_2025.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/b/b9/GEM_staircase_at_night_with_visitors_2025.jpg","w":4096,"h":3072,"by":"Matthäus Wander","lic":"CC0","page":"https://commons.wikimedia.org/wiki/File:GEM_staircase_at_night_with_visitors_2025.jpg","cap":"The Grand Staircase, GEM"},"lat":29.99361,"lng":31.11972,"ar":"المتحف المصري الكبير","plan":"10:30 AM","title":"Grand Egyptian Museum (GEM)","timeNote":"Book a 10:30–11 AM entry slot"},{"type":"lunch","text":"Zööba (inside GEM) — grab-and-go koshari, lentils/rice/pasta/crispy onions/tomato-cumin sauce, widely considered Egypt's national dish. No detour needed. Leave by ~2:15 PM for Old Cairo.","plan":"1:00 PM"},{"type":"stop","kind":"church","short":"Coptic Cairo","name":"Coptic Cairo: Hanging Church, Abu Serga, Ben Ezra Synagogue & Coptic Museum","title":"Coptic Cairo","photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/By_ovedc_-_Hanging_Church_%28Cairo%29_-_01.jpg/{w}px-By_ovedc_-_Hanging_Church_%28Cairo%29_-_01.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/c/cd/By_ovedc_-_Hanging_Church_%28Cairo%29_-_01.jpg","w":5312,"h":2988,"by":"Ovedc","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:By_ovedc_-_Hanging_Church_(Cairo)_-_01.jpg","cap":"The Hanging Church"},"lat":30.00542,"lng":31.23008,"ar":"الكنيسة المعلقة – مصر القديمة (مجمع الأديان)","plan":"3:00 PM","timeNote":"Ben Ezra closes 4 PM","address":"Mar Girgis, Old Cairo (Misr al-Qadima)","getTo":"~35–45 min by taxi or Uber from the GEM. Start at Ben Ezra Synagogue, which closes first, then Abu Serga next door, the Hanging Church and the Coptic Museum.","recTime":"1.75 hours","hours":"Churches ~9 AM – 5 PM; Ben Ezra 9 AM – 4 PM (closed Fridays); Coptic Museum 9 AM – 5 PM","history":"Old Cairo grew up inside Babylon Fortress, a Roman stronghold on the Nile whose towers still stand. The Hanging Church (al-Muallaqa) is built on top of the fortress's water gate, so its nave seems to hang above the passage below. A church has stood here since around the 3rd–4th century, and in the 11th century it became the seat of the Coptic Pope.","more":"Steps away, Abu Serga (Saints Sergius and Bacchus) is built over a crypt where tradition says the Holy Family sheltered during their flight into Egypt. The Ben Ezra Synagogue is where the Cairo Geniza was found in the 1890s: some 300,000 manuscript fragments covering a thousand years of Jewish life around the Mediterranean. The Coptic Museum next door holds the world's largest collection of Coptic Christian art.","fact":"Coptic, still used in the liturgy here, is the last stage of the ancient Egyptian language, written in Greek letters plus a few signs borrowed from Egyptian script.","photoTip":"The Hanging Church's twin bell towers frame best from the courtyard at the top of the stairs.","mustTry":null,"tips":["Dress modestly: shoulders and knees covered, and a scarf for women in the churches and the synagogue.","No photos inside Ben Ezra Synagogue.","Order: Ben Ezra (closes 4) → Abu Serga → Hanging Church → Coptic Museum (open until 5; give it ~45 min)."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":null,"query":"Hanging Church, Old Cairo, Egypt","primary":true},{"label":"Ben Ezra Synagogue","placeId":null,"query":"Ben Ezra Synagogue, Cairo"},{"label":"Coptic Museum","placeId":null,"query":"Coptic Museum, Cairo"}],"bookings":[{"label":"Coptic Museum tickets — egymonuments.com (the churches are free)","url":"https://egymonuments.com/"}],"stampable":true,"id":"jan5-coptic-cairo"},{"type":"stop","id":"dec28-cairo-tower-at-sunset","kind":"tower","short":"Cairo Tower","name":"Cairo Tower at Dusk","address":"Gezira Island, Zamalek, Cairo","getTo":"~20–25 min by taxi or Uber from Old Cairo, up the Corniche to Zamalek. Sunset is ~5:00 PM in late December, so you reach the deck in the afterglow as the city lights come on.","recTime":"45 min – 1 hour","hours":"Open 9 AM – 11 PM. The tower was closed for renovation in early 2026 and had reopened by May 2026 — confirm it's open the week before you go.","history":"A 187m lattice tower on Gezira Island, completed in 1961 and designed by architect Naoum Shebib to evoke a lotus plant. It was built under President Nasser with funds reportedly offered by the U.S. government to sway Egypt's Cold War alignment — Nasser redirected the money into this tower as a very visible statement of non-alignment. For 50 years it was the tallest structure in Egypt and North Africa.","history2":null,"more":null,"fact":"Locals nicknamed it \"Nasser's Pole\" — a play on the story of the redirected American money.","photoTip":"From the 360° open-air deck: the Nile bending through the city to the east, and on a clear evening the Pyramids silhouetted on the western horizon as the sun drops behind them — a full-circle view of everything you saw today.","mustTry":null,"tips":[],"notes":["Tickets sold at the base on arrival (~350 EGP observation deck) — no advance booking needed"],"maps":[{"label":"Open in Google Maps","placeId":"ChIJpVgdqJpAWBQR_tZY0ny_5mw","query":"Cairo Tower, Zamalek, Cairo, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Cairo_tower%2C_26_July_2024.jpg/{w}px-Cairo_tower%2C_26_July_2024.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/b/bd/Cairo_tower%2C_26_July_2024.jpg","w":3000,"h":4000,"by":"أحمد ناجي","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Cairo_tower,_26_July_2024.jpg","cap":""},"lat":30.04583,"lng":31.22444,"ar":"برج القاهرة – الزمالك","plan":"5:15 PM","title":"Cairo Tower at dusk","timeNote":"Afterglow, then the city lights"},{"type":"dinner","id":"dec28-cafe-riche","kind":"food","short":"Cafe Riche","name":"Cafe Riche","address":"17 Talaat Harb St, Downtown Cairo","getTo":"~25-min walk from Cairo Tower over Qasr El Nil Bridge, past its bronze lions, then across Tahrir Square to Talaat Harb Street (or a 10-min taxi).","recTime":null,"hours":null,"history":"Opened 1908, a legendary haunt of Egyptian revolutionaries and writers, including Naguib Mahfouz — Nasser and the Free Officers reportedly met here while planning the 1952 revolution. Cash only.","history2":null,"more":null,"fact":null,"photoTip":null,"mustTry":"Lentil fatta, a cold Stella beer, or Turkish coffee.","tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJG__pfnpBWBQRhJzaSgwA8wI","query":"Cafe Riche, Talaat Harb, Cairo, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Cafe_Riche.jpg/{w}px-Cafe_Riche.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/a/a2/Cafe_Riche.jpg","w":2592,"h":1552,"by":"Nableezy","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Cafe_Riche.jpg","cap":""},"lat":30.04694,"lng":31.23823,"ar":"مقهى ريش – ١٧ شارع طلعت حرب، وسط البلد","plan":"6:45 PM","title":"Cafe Riche","timeNote":null}],"walking":"~5 km, flat","pacing":"Pyramids at opening while it's cool, a camel ride out to the Panorama Point, a late-morning GEM slot with lunch inside, then Coptic Cairo (Ben Ezra closes at 4, the Coptic Museum at 5), Cairo Tower as the city lights come on, and a walk over the Nile to dinner downtown.","places":[],"hotelInfo":{"name":"Marriott Mena House","city":"Giza","placeId":"ChIJJTcLq4VFWBQRss6Y4MGJSVw","query":"Marriott Mena House Cairo","phone":"+20 2 33773222","note":"Former royal hunting lodge (1869) at the foot of the Pyramids. Ask for a Pyramid View room.","ar":"فندق ماريوت مينا هاوس – الهرم","lat":29.98556,"lng":31.13278,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/The_Oberoi_-_Mena_House%2C_Egypt.jpg/{w}px-The_Oberoi_-_Mena_House%2C_Egypt.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/4/4e/The_Oberoi_-_Mena_House%2C_Egypt.jpg","w":1536,"h":1024,"by":"Paul Mannix","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:The_Oberoi_-_Mena_House,_Egypt.jpg","cap":""}},"hero":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/All_Gizah_Pyramids.jpg/{w}px-All_Gizah_Pyramids.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/a/af/All_Gizah_Pyramids.jpg","w":4372,"h":2906,"by":"Ricardo Liberato","lic":"CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:All_Gizah_Pyramids.jpg","cap":""},"saves":"Clash fixed","optimized":["Fixed a clash: the old plan had the GEM starting at 9 AM, but you'd be at the pyramids until ~10. Book a 10:30–11 AM GEM slot instead.","From your draft: the camel ride ends at the Panorama Point, close to the drive to the GEM.","Coptic Cairo moved here from Jan 5, now that your flight home leaves at 5:30 AM. Old Cairo sits between the GEM and Cairo Tower.","No felucca in Cairo (you sail in Aswan), so the GEM keeps its full 3.5 hours and the Coptic Museum fits before it closes at 5."]},{"id":"dec29","dow":"Tue","date":"Dec 29","full":"Tuesday, December 29, 2026","city":"Alexandria","region":"alex","title":"Alexandria day trip","hotel":"menaHouse","links":[{"label":"Egyptian National Railways (trains)","url":"https://enr.gov.eg/"},{"label":"Uber (works in Alexandria)","url":"https://www.uber.com/eg/en/"}],"endNote":"Return train to Cairo from Sidi Gaber station (~5-min taxi from Stanley Bridge). Your draft planned a 6 AM–6 PM day; this route ends with dinner at GAD around 6, then the train.","items":[{"type":"stop","id":"dec29-roman-amphitheatre-kom-el-dikka","kind":"column","short":"Kom el-Dikka","name":"Roman Amphitheatre, Kom El Dikka","address":"Kom Ad Dakah, Alexandria","getTo":"The 6:00 AM train reaches Misr Station ~8:15. Kom el-Dikka is a 5-minute walk; it opens at 9, so grab a coffee first.","recTime":"30–45 min","hours":"9 AM – 4 PM","history":"Egypt's only surviving Roman theater, well-preserved white-marble seating for ~800 — excavation nearby continues to turn up mosaics.","history2":null,"more":"The theater was uncovered in 1960 while the ground was being cleared for a government building, and a Polish mission has excavated here ever since. Around it are Roman baths, a row of lecture halls that may have been a late-antique university, and the mosaic floors of the Villa of the Birds.","fact":"Excavators originally dug here searching for Alexande
