r the Great's tomb and found this theater instead.","photoTip":"From the top row of seats, looking down over the full semicircle.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJw8X7WevD9RQR5AbK2CfyPPU","query":"Roman Amphitheatre, Kom El Dikka, Alexandria, Egypt","primary":true},{"label":"Kom el-Dikka site","placeId":"ChIJKaHaVOvD9RQRuJH_pNRJkTo","query":"Kom el Dikka Alexandria"}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Odeon_at_Kom_el_Dikka_%28I%29.jpg/{w}px-Odeon_at_Kom_el_Dikka_%28I%29.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/8/8c/Odeon_at_Kom_el_Dikka_%28I%29.jpg","w":2983,"h":2037,"by":"isawnyu","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Odeon_at_Kom_el_Dikka_(I).jpg","cap":""},"lat":31.19447,"lng":29.90362,"ar":"المسرح الروماني – كوم الدكة","plan":"9:00 AM","title":"Roman Amphitheatre, Kom El Dikka","timeNote":null},{"type":"stop","id":"dec29-pompey-s-pillar-serapeum","kind":"column","short":"Pompey's Pillar","name":"Pompey's Pillar & Serapeum","address":"Karmouz, Alexandria","getTo":"~10-min taxi southwest to Karmouz.","recTime":"45 min","hours":"9 AM – 5 PM","history":"Misleadingly named — this 20m red-granite column actually honors Emperor Diocletian (c. 297 CE) and once stood within the Serapeum temple complex, believed to have housed a \"daughter library\" to the Library of Alexandria.","history2":null,"more":"Medieval travelers believed the head of the Roman general Pompey was kept in an urn on top, which is how the column got its name. The shaft is a single piece of red Aswan granite, floated about 1,000 km down the Nile, and the whole monument stands roughly 27 m tall.","fact":"The pillar's single column shaft is one of the largest ancient monoliths still standing in Egypt outside of Luxor/Aswan.","photoTip":"Wide shot from the base looking straight up the column.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJVUwIosXD9RQRmZKCQYexAbo","query":"Pompey's Pillar & Serapeum, Alexandria, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/AlexSarapeionPompeysPillar.jpg/{w}px-AlexSarapeionPompeysPillar.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/b/be/AlexSarapeionPompeysPillar.jpg","w":2400,"h":1600,"by":"Roland Unger","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:AlexSarapeionPompeysPillar.jpg","cap":""},"lat":31.1825,"lng":29.89639,"ar":"عمود السواري – كرموز","plan":"9:45 AM","title":"Pompey's Pillar & Serapeum","timeNote":null},{"type":"stop","id":"dec29-catacombs-of-kom-el-shoqafa","kind":"tomb","short":"Kom el-Shoqafa","name":"Catacombs of Kom El Shoqafa","address":"Karmouz, Alexandria","getTo":"~10-min walk from Pompey's Pillar, same neighborhood.","recTime":"45 min – 1 hour","hours":"9 AM – 4 PM","history":"A 2nd-century CE Roman-era burial complex discovered entirely by accident in 1900 when a donkey fell through the ground. One of the Seven Wonders of the Middle Ages — carved sphinxes, jackal-headed Anubis figures, and Roman columns with Medusa reliefs, blending Egyptian and Greco-Roman styles in one tomb.","history2":null,"more":"The tomb cuts down three levels into the bedrock; the lowest is now flooded by groundwater. Bodies were lowered on ropes down the central shaft. A side chamber packed with human and horse bones is traditionally linked to Emperor Caracalla's massacre of Alexandria's young men in 215 CE.","fact":"The central shaft was engineered to lower bodies straight down to three separate underground levels.","photoTip":"The main burial chamber's facade, lit from below.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJl6MZKprD9RQRkXHrajGfwGw","query":"Catacombs of Kom El Shoqafa, Alexandria, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/%CE%9A%CE%B1%CF%84%CE%B1%CE%BA%CF%8C%CE%BC%CE%B2%CE%B5%CF%82_%CE%9A%CE%BF%CE%BC_%CE%95%CE%BB_%CE%A3%CE%BF%CF%85%CE%BA%CE%AC%CF%86%CE%B1.jpg/{w}px-%CE%9A%CE%B1%CF%84%CE%B1%CE%BA%CF%8C%CE%BC%CE%B2%CE%B5%CF%82_%CE%9A%CE%BF%CE%BC_%CE%95%CE%BB_%CE%A3%CE%BF%CF%85%CE%BA%CE%AC%CF%86%CE%B1.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/0/0f/%CE%9A%CE%B1%CF%84%CE%B1%CE%BA%CF%8C%CE%BC%CE%B2%CE%B5%CF%82_%CE%9A%CE%BF%CE%BC_%CE%95%CE%BB_%CE%A3%CE%BF%CF%85%CE%BA%CE%AC%CF%86%CE%B1.jpg","w":1743,"h":1330,"by":"Asiatologist","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:%CE%9A%CE%B1%CF%84%CE%B1%CE%BA%CF%8C%CE%BC%CE%B2%CE%B5%CF%82_%CE%9A%CE%BF%CE%BC_%CE%95%CE%BB_%CE%A3%CE%BF%CF%85%CE%BA%CE%AC%CF%86%CE%B1.jpg","cap":""},"lat":31.17856,"lng":29.89295,"ar":"مقابر كوم الشقافة – كرموز","plan":"10:30 AM","title":"Catacombs of Kom El Shoqafa","timeNote":null},{"type":"stop","id":"dec29-abu-abbas-al-mursi-mosque","kind":"mosque","short":"Abu al-Abbas","name":"Abu Abbas al-Mursi Mosque","address":"As Sayalah Sharq, Alexandria","getTo":"~15-min taxi north to the Anfushi waterfront.","recTime":"20–30 min (exterior)","hours":"10:30 AM – 9 PM","history":"A 13th-century Sufi shrine dedicated to Abu al-Abbas al-Mursi, a Sufi scholar born in Murcia, Spain, who settled in Alexandria after the Christian Reconquista. Rebuilt in the 1940s in Mamluk-revival style.","history2":null,"more":"Abu al-Abbas al-Mursi (1219–1287) was born in Murcia, Spain, and became the leading master of the Shadhili Sufi order after settling in Alexandria. The present building, designed by the Italian architect Mario Rossi, went up in the 1930s and 1940s.","fact":"The mosque's interior ceiling design is noticeably different from typical mosque architecture — worth a glance inside if open.","photoTip":"The exterior domes from the harbor side, where the Mamluk-revival detailing stands out best.","mustTry":null,"tips":["Modest dress; women should cover hair to go inside."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJZ3cyTP3D9RQRM2qVGbUEklg","query":"Abu Abbas al-Mursi Mosque, Alexandria, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/2007-05-043.jpg/{w}px-2007-05-043.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/f/fa/2007-05-043.jpg","w":2048,"h":1365,"by":"Argenberg","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:2007-05-043.jpg","cap":""},"lat":31.20561,"lng":29.88225,"ar":"مسجد المرسي أبو العباس – بحري","plan":"11:35 AM","title":"Abu Abbas al-Mursi Mosque","timeNote":null},{"type":"stop","id":"dec29-qaitbay-citadel","kind":"fortress","short":"Qaitbay","name":"Qaitbay Citadel","address":"Al Gomrok, Alexandria","getTo":"~5–10 min drive or a 20-min walk along the harbor.","recTime":"1 hour","hours":"9 AM – 8 PM","history":"Built in 1477 directly atop the ruins of the Lighthouse of Alexandria (one of the Seven Wonders of the Ancient World), using some of its original stone blocks.","history2":null,"more":"The Pharos of Alexandria, built around 280 BCE under Ptolemy II, may have stood about 100 m tall and guided ships for well over a thousand years. Earthquakes in the 10th–14th centuries brought it down. Archaeologists have since mapped thousands of its blocks and statues on the harbor floor just off the fort's walls.","fact":"Sultan Al-Ashraf Qaitbay built the fortress specifically on the lighthouse's ruined foundation after an earthquake toppled what remained of it in the 14th century.","photoTip":"The fortress walls against the Mediterranean, shot from the harbor breakwater.","mustTry":null,"tips":["Small boats wait along the Eastern Harbour Corniche and offer short harbour rides; agree the price first."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJuxEpKFLD9RQRHz2y-AiDn-U","query":"Qaitbay Citadel, Alexandria, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/%D8%A7%D9%84%D9%82%D9%84%D8%B9%D8%A9_%D8%A7%D8%B3%D9%83%D9%86%D8%AF%D8%B1%D9%8A%D8%A9.jpg/{w}px-%D8%A7%D9%84%D9%82%D9%84%D8%B9%D8%A9_%D8%A7%D8%B3%D9%83%D9%86%D8%AF%D8%B1%D9%8A%D8%A9.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/8/81/%D8%A7%D9%84%D9%82%D9%84%D8%B9%D8%A9_%D8%A7%D8%B3%D9%83%D9%86%D8%AF%D8%B1%D9%8A%D8%A9.jpg","w":5847,"h":4177,"by":"Summering2018","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:%D8%A7%D9%84%D9%82%D9%84%D8%B9%D8%A9_%D8%A7%D8%B3%D9%83%D9%86%D8%AF%D8%B1%D9%8A%D8%A9.jpg","cap":""},"lat":31.214,"lng":29.8856,"ar":"قلعة قايتباي","plan":"12:05 PM","title":"Qaitbay Citadel","timeNote":null},{"type":"lunch","text":"Grab-and-go grilled fish from a Corniche waterfront stall — the Corniche runs 10+ miles along the Mediterranean, so eat wherever you are rather than detouring.","plan":"1:10 PM"},{"type":"stop","id":"dec29-bibliotheca-alexandrina","kind":"library","short":"Bibliotheca","name":"Bibliotheca Alexandrina","address":"El Shatby, Alexandria","getTo":"~15-min taxi east along the Corniche. Keep it to a 1-hour highlights visit so the Jewelry Museum still fits.","recTime":"1 hour (highlights)","hours":"Tue: 10 AM – 7 PM (closed Fridays)","history":"The ancient Library of Alexandria, founded c. 295 BCE under Ptolemy I and organized by Demetrius of Phalerum, once held scholars like Euclid, Archimedes, and Eratosthenes — its decline was gradual over centuries, not a single dramatic fire as popularly told. The modern library, opened 2002, is a tilted granite disc (Snøhetta design) carved with scripts from 120+ languages, holding ~8 million books, with a reading room seating 2,000.","history2":"Interior visit worthwhile: Antiquities Museum, Manuscript Museum, and Planetarium.","more":"The modern library was an international project led by Egypt and UNESCO. The Norwegian firm Snøhetta won the 1989 design competition. The granite wall's carved letters come from writing systems around the world, ancient and modern, and the sphere on the plaza is the planetarium.","fact":"The building's 11 cascading floors are meant to evoke a rising sun.","photoTip":"The exterior granite wall of carved scripts, shot low and wide to catch the full curve.","mustTry":null,"tips":["Bag check at the entrance; large backpacks go to the cloakroom.","Tickets: bibalex.org (online ticketing) or at the door."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJhf5iBYrD9RQR5yPsMsZMowA","query":"Bibliotheca Alexandrina, Alexandria, Egypt","primary":true}],"bookings":[{"label":"bibalex.org","url":"https://www.bibalex.org"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Inside_Bibliotheca_Alexandrina_%282007-05-027%29.jpg/{w}px-Inside_Bibliotheca_Alexandrina_%282007-05-027%29.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/3/31/Inside_Bibliotheca_Alexandrina_%282007-05-027%29.jpg","w":2048,"h":1365,"by":"Argenberg","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Inside_Bibliotheca_Alexandrina_(2007-05-027).jpg","cap":"The Bibliotheca's reading room"},"lat":31.20889,"lng":29.90917,"ar":"مكتبة الإسكندرية – الشاطبي","plan":"1:45 PM","title":"Bibliotheca Alexandrina","timeNote":null},{"type":"stop","id":"dec29-royal-jewelry-museum","kind":"museum","short":"Royal Jewels","name":"Royal Jewelry Museum","address":"Zizinia, Alexandria","getTo":"~15-min taxi east along the Corniche. Be there by 3:30 PM: the ticket window closes at 4.","recTime":"45 min – 1 hour","hours":"9 AM – 5 PM; ticket window closes 4 PM","history":"Housed in a 1919 Italian-style royal palace, displaying jewelry and personal items of Egypt's royal family — crowns, a diamond-studded chess set, Princess Fawzia's wedding tiara among the highlights.","history2":null,"more":"The palace was built for Princess Fatma al-Zahraa, a member of Muhammad Ali's dynasty, and opened as a museum in 1986. Even the bathrooms are decorated with painted tiles, which many visitors rate as highlights.","fact":"The palace's stained-glass windows and ceilings are considered as much the attraction as the jewelry itself.","photoTip":"The main hall ceiling, shot straight up.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJy_MpOynF9RQRd0iVR1mVkPc","query":"Royal Jewelry Museum, Alexandria, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Royal_Jewelry_Museum_Alexandria.jpg/{w}px-Royal_Jewelry_Museum_Alexandria.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/c/cb/Royal_Jewelry_Museum_Alexandria.jpg","w":5985,"h":3990,"by":"Mohamed abdelzaher","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Royal_Jewelry_Museum_Alexandria.jpg","cap":"Ceiling, Royal Jewelry Museum"},"lat":31.2407,"lng":29.963,"ar":"متحف المجوهرات الملكية – زيزينيا","plan":"3:00 PM","title":"Royal Jewelry Museum","timeNote":"Ticket window closes 4 PM"},{"type":"stop","id":"dec29-montaza-palace-gardens","kind":"garden","short":"Montaza","name":"Montaza Palace Gardens","address":"Al Mandarah Bahri, Alexandria","getTo":"~15-min taxi further east. The gardens stay open into the evening; arrive around sunset (~5:00 PM).","recTime":"30–45 min (exterior/gardens)","hours":null,"history":"The estate began in 1892, when Khedive Abbas II Hilmi built the Salamlek as a hunting lodge; King Fuad I added the larger Ottoman/Florentine-style Haramlik palace in 1932. It became the royal family's summer residence.","history2":null,"more":null,"fact":"The grounds reportedly include 365 roads — one for each day of the year.","photoTip":"The red turrets and towers against the garden palms.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJy-wz9V7Q9RQRWJjvYkcVgq4","query":"Montaza Palace Gardens, Alexandria, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Montaza_Palace%2C_Alexandria%2C_Egypt_-_Murat_%C3%96zsoy_2018.jpg/{w}px-Montaza_Palace%2C_Alexandria%2C_Egypt_-_Murat_%C3%96zsoy_2018.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/c/c6/Montaza_Palace%2C_Alexandria%2C_Egypt_-_Murat_%C3%96zsoy_2018.jpg","w":3648,"h":1979,"by":"Murat Özsoy 1958","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Montaza_Palace,_Alexandria,_Egypt_-_Murat_%C3%96zsoy_2018.jpg","cap":""},"lat":31.2886,"lng":30.0159,"ar":"حدائق المنتزه","plan":"4:15 PM","title":"Montaza Palace Gardens","timeNote":"Sunset ~5:05 PM"},{"type":"stop","id":"dec29-stanly-bridge","kind":"bridge","short":"Stanley Bridge","name":"Stanley Bridge","address":"Fleming, Alexandria","getTo":"~15–20 min taxi back west along the Corniche from Montaza.","recTime":"30–45 min","hours":null,"history":"Egypt's first modern bridge over the sea, built in Moorish/Islamic-revival style. Best walked at night.","history2":null,"more":"The bridge opened in 2001 and quickly became Alexandria's favorite evening landmark. Its four towers are lit at night, and the little Stanley Bay beach sits right below.","fact":null,"photoTip":"The bridge's arches lit up at night, shot from the beach below.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJx-dlLufE9RQRecYrOk5BNA0","query":"Stanly Bridge, Alexandria, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Stanley_Bridge%2C_Alexandria%2C_March_2018.jpg/{w}px-Stanley_Bridge%2C_Alexandria%2C_March_2018.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/9/99/Stanley_Bridge%2C_Alexandria%2C_March_2018.jpg","w":6000,"h":4000,"by":"Mona Hassan Abo-Abda","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Stanley_Bridge,_Alexandria,_March_2018.jpg","cap":""},"lat":31.235,"lng":29.94861,"ar":"كوبري ستانلي","plan":"5:30 PM","title":"Stanley Bridge","timeNote":null},{"type":"dinner","id":"dec29-gad","kind":"food","short":"GAD","name":"GAD","address":"272 El-Gaish Rd, near Stanly Bridge, Alexandria","getTo":"Right next to Stanly Bridge.","recTime":null,"hours":null,"history":"A Alexandria institution for fuul (fava beans) and falafel — fast, local, and perfectly timed for a walk across the bridge after.","history2":null,"more":null,"fact":null,"photoTip":null,"mustTry":"Fuul and falafel sandwich.","tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJf_ddUN3E9RQR959nVllRdYo","query":"GAD, Alexandria, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Falafels_2.jpg/{w}px-Falafels_2.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/5/57/Falafels_2.jpg","w":4160,"h":2340,"by":"Popo le Chien","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Falafels_2.jpg","cap":"Ta'meya, Egyptian falafel"},"lat":31.23514,"lng":29.95052,"ar":"مطعم جاد – ستانلي","plan":"6:00 PM","title":"GAD","timeNote":null}],"transport":"2-hour express train from Bashtil or Ramses Station via Egyptian National Railways (enr.gov.eg). Both serve Alexandria, so check which one your train leaves from. Foreign-tourist e-ticketing isn't always reliable online — a local agent or in-person counter purchase the day before is a safe backup. Target the ~6:00 AM departure.","walking":"~8 km, sequenced west-to-east along the Corniche","pacing":"Ambitious day: 9 stops plus two 2-hr train legs, running west → east along the Corniche and ending near Sidi Gaber station. Hard stops: the Catacombs close at 4 PM, and Jewelry Museum tickets stop at 4 PM. If you fall behind, drop Montaza.","places":[{"label":"Bashtil train station (Giza)","placeId":"ChIJXRKmPBlBWBQRnMxnVR_fNHY","query":"Bashtil train station (Giza), Egypt"},{"label":"Alexandria Misr Station","placeId":"ChIJI8l5ierD9RQRYjnGIaDPTo4","query":"Alexandria Misr Station, Egypt"},{"label":"Sidi Gaber station","placeId":"ChIJkzB_A5PE9RQRhnlguz1BI0c","query":"Sidi Gaber station, Egypt"}],"hotelInfo":{"name":"Marriott Mena House","city":"Giza","placeId":"ChIJJTcLq4VFWBQRss6Y4MGJSVw","query":"Marriott Mena House Cairo","phone":"+20 2 33773222","note":"Former royal hunting lodge (1869) at the foot of the Pyramids. Ask for a Pyramid View room.","ar":"فندق ماريوت مينا هاوس – الهرم","lat":29.98556,"lng":31.13278,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/The_Oberoi_-_Mena_House%2C_Egypt.jpg/{w}px-The_Oberoi_-_Mena_House%2C_Egypt.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/4/4e/The_Oberoi_-_Mena_House%2C_Egypt.jpg","w":1536,"h":1024,"by":"Paul Mannix","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:The_Oberoi_-_Mena_House,_Egypt.jpg","cap":""}},"hero":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/%D8%A7%D9%84%D9%82%D9%84%D8%B9%D8%A9_%D8%A7%D8%B3%D9%83%D9%86%D8%AF%D8%B1%D9%8A%D8%A9.jpg/{w}px-%D8%A7%D9%84%D9%82%D9%84%D8%B9%D8%A9_%D8%A7%D8%B3%D9%83%D9%86%D8%AF%D8%B1%D9%8A%D8%A9.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/8/81/%D8%A7%D9%84%D9%82%D9%84%D8%B9%D8%A9_%D8%A7%D8%B3%D9%83%D9%86%D8%AF%D8%B1%D9%8A%D8%A9.jpg","w":5847,"h":4177,"by":"Summering2018","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:%D8%A7%D9%84%D9%82%D9%84%D8%B9%D8%A9_%D8%A7%D8%B3%D9%83%D9%86%D8%AF%D8%B1%D9%8A%D8%A9.jpg","cap":""},"saves":"~20 min","optimized":["Start at Kom el-Dikka, a 5-minute walk from Misr Station: no taxi, no backtracking from Karmouz.","The Bibliotheca is now a 1-hour highlights visit, so you reach the Royal Jewelry Museum before its 4 PM ticket cutoff. The old timing arrived after it.","If you're running late, Montaza is the one to drop: it's the farthest stop."]},{"id":"dec30","dow":"Wed","date":"Dec 30","full":"Wednesday, December 30, 2026","city":"Sharm El Sheikh","region":"sharm","title":"Red Sea reefs & the Sinai desert","hotel":"sharm","links":[{"label":"EgyptAir","url":"https://www.egyptair.com/"},{"label":"Careem (Sharm taxis)","url":"https://www.careem.com/"}],"endNote":"Overnight in Sharm El Sheikh. Set an early alarm for the morning flight back to Cairo.","items":[{"type":"stop","id":"dec30-as-samaan-coptic-church-heavenly-cathedr","kind":"church","short":"Heavenly Cathedral","name":"As-Samaan Coptic Church (Heavenly Cathedral)","address":"Al Maahad Al Dini, Sharm El Sheikh","getTo":"~20 min from the airport, on the way south to the Old Sharm marina. It opens around 8 AM.","recTime":"30–45 min","hours":"Open daily","history":"A modern cathedral (built just over a decade ago) with striking murals — Creation through the life of Christ — completed over two years by two artists. Free entry.","history2":null,"more":null,"fact":"Despite being barely a decade old, it's frequently rated among the most beautiful Coptic cathedrals in Egypt.","photoTip":"The stained glass windows backlit by afternoon sun.","mustTry":null,"tips":["Free entry. Long skirts are provided for women at the entrance."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJ2QNrIb85UxQROf85YfJfmOI","query":"As-Samaan Coptic Church, Sharm El Sheikh, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/The_Heavenly_Cathedral_Sharm_el_Sheikh%2C_22.12.2022.jpg/{w}px-The_Heavenly_Cathedral_Sharm_el_Sheikh%2C_22.12.2022.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/e/e3/The_Heavenly_Cathedral_Sharm_el_Sheikh%2C_22.12.2022.jpg","w":4096,"h":3072,"by":"Jkordik","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:The_Heavenly_Cathedral_Sharm_el_Sheikh,_22.12.2022.jpg","cap":""},"lat":27.85041,"lng":34.3057,"ar":"كنيسة السمائيين – الهضبة","plan":"8:30 AM","title":"The Heavenly Cathedral","timeNote":"On the way from the airport"},{"type":"stop","id":"dec30-ras-mohammed-national-park-white-island","kind":"reef","short":"Ras Mohammed","name":"Ras Mohammed National Park & White Island","address":"South Sinai Governorate","getTo":"Boats leave from the Old Sharm marina, ~5 min from the cathedral. Book a half-day boat (or a private speedboat) so you're back by ~1 PM; most include pickup.","recTime":"3–4 hours","hours":null,"history":"Egypt's first national park (est. 1983), where the Gulf of Suez and Gulf of Aqaba meet — the collision of currents creates some of the clearest, most biodiverse reef water in the Red Sea. White Island's shallow sandbar and seagrass beds are a short boat hop away.","history2":null,"more":"Ras Mohammed sits at the very southern tip of the Sinai Peninsula. Its reef walls plunge straight down into very deep water, which is why sharks, turtles and huge schools of fish come so close to shore. White Island is a sandbar that appears and disappears with the tides and season.","fact":"The park's mangrove channel is one of the northernmost mangrove ecosystems in the world.","photoTip":"The turquoise shallows from the clifftop viewpoint near the main beach.","mustTry":null,"tips":["Bring water shoes; the walk from the boat to White Island is over rough seabed.","Reef-safe sunscreen; touching coral is banned."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJjaZakvEjUxQRRZNUw4HthtI","query":"Ras Mohammed National Park & White Island, Sharm El Sheikh, Egypt","primary":true},{"label":"White Island","placeId":"ChIJY1P0GdIhUxQRQq2PqLqXvdg","query":"White Island Ras Mohammed"}],"bookings":[{"label":"Entry paid at the gate (~€10/person cash); guided snorkel boat trip via Viator or GetYourGuide","url":"https://www.viator.com"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Pez_%C3%A1ngel_real_%28Pygoplites_diacanthus%29%2C_parque_nacional_Ras_Muhammad%2C_Egipto%2C_2022-03-26%2C_DD_155.jpg/{w}px-Pez_%C3%A1ngel_real_%28Pygoplites_diacanthus%29%2C_parque_nacional_Ras_Muhammad%2C_Egipto%2C_2022-03-26%2C_DD_155.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/0/0a/Pez_%C3%A1ngel_real_%28Pygoplites_diacanthus%29%2C_parque_nacional_Ras_Muhammad%2C_Egipto%2C_2022-03-26%2C_DD_155.jpg","w":3614,"h":2409,"by":"Diego Delso","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Pez_%C3%A1ngel_real_(Pygoplites_diacanthus),_parque_nacional_Ras_Muhammad,_Egipto,_2022-03-26,_DD_155.jpg","cap":"Royal angelfish, Ras Mohammed"},"lat":27.76944,"lng":34.20972,"ar":"محمية رأس محمد","plan":"9:00 AM","title":"Ras Mohammed National Park & White Island","timeNote":"Half-day boat"},{"type":"stop","kind":"reef","short":"Seascope","name":"Seascope semi-submarine","photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Gelbes_Schiff_mit_Glasboden_im_Roten_Meer_in_%C3%84gypten_2H1A6659WI.jpg/{w}px-Gelbes_Schiff_mit_Glasboden_im_Roten_Meer_in_%C3%84gypten_2H1A6659WI.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/8/84/Gelbes_Schiff_mit_Glasboden_im_Roten_Meer_in_%C3%84gypten_2H1A6659WI.jpg","w":5450,"h":3636,"by":"Kora27","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Gelbes_Schiff_mit_Glasboden_im_Roten_Meer_in_%C3%84gypten_2H1A6659WI.jpg","cap":"A glass-bottomed semi-submarine on the Red Sea"},"lat":27.8652,"lng":34.2958,"ar":"مرسى سي سكوب – بجوار السوق القديم، شرم الشيخ","plan":"1:30 PM","timeNote":"~90 min; confirm the sailing time","address":"Sea Scope marina, next to the Old Market, Old Sharm","getTo":"The Ras Mohammed boats come back to the Old Sharm marina; the Seascope dock is next to the Old Market. Grab lunch at the marina first.","recTime":"1.5 hours","hours":"Daytime sailings","history":"Sharm's reefs grow right up to the shore where the Gulf of Aqaba meets the Red Sea. A semi-submarine has a glass-walled hull below the waterline, so you sit in a viewing deck a couple of meters down while the boat idles over the coral and fish swim past the windows.","more":"Scientists study the northern Red Sea's corals because they cope with heat better than most, which may make them a refuge as reefs elsewhere bleach.","fact":"The Red Sea has more than 1,000 species of fish, and around one in ten lives nowhere else.","photoTip":"Sit close to the glass and switch your flash off; the window reflects it.","mustTry":null,"tips":["Book a slot (Viator, GetYourGuide or at the marina) and confirm the sailing time; trips run several times a day.","A dry way to see the reef, good if anyone in the group isn't keen on snorkeling.","Calm water gives the clearest view; the afternoon wind can make it choppier."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":null,"query":"Seascope semi submarine, Old Market, Sharm El Sheikh, Egypt","primary":true}],"bookings":[{"label":"Seascope semi-submarine trip — Viator or GetYourGuide","url":"https://www.getyourguide.com/"}],"stampable":true,"id":"dec30-seascope-semi-submarine","title":"Seascope semi-submarine"},{"type":"stop","id":"dec30-sinai-desert-atv-buggy-safari","kind":"desert","short":"Sinai Desert","name":"Sinai Desert ATV/Buggy Safari","address":"Sinai Desert, Sharm El Sheikh","getTo":"Pickup from the Old Sharm marina area or your hotel, included in the tour.","recTime":"4–5 hours including the Bedouin camp","hours":null,"history":"Quad or buggy ride into the desert timed for sunset, followed by a Bedouin camp stop: traditional tea, bread-making demo, barbecue dinner, often a fire show, belly dancing, or Tanoura folk dance, and stargazing with a telescope guide — minimal light pollution out here.","history2":null,"more":"The mountains around Sharm belong to the same granite massif as Mount Sinai, about three hours' drive north. The Bedouin tribes of South Sinai, such as the Muzeina, have herded and guided in this desert for centuries; most desert camps near Sharm are run with Bedouin families.","fact":null,"photoTip":"The sunset over the desert dunes, shot low and wide before the ATVs kick up dust.","mustTry":null,"tips":["Wear sunglasses and a scarf for the dust.","Desert nights in late December get cold; bring a layer.","Many packages add a short camel ride; pick one that does if you'd like a ride here too."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":null,"query":"Sinai Desert, Sharm El Sheikh, Egypt","primary":true}],"bookings":[{"label":"Book a Bedouin-village-inclusive package — Viator or GetYourGuide","url":"https://www.getyourguide.com"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Sinai_Desert%2C_Egypt%2C_expansive_vistas.jpg/{w}px-Sinai_Desert%2C_Egypt%2C_expansive_vistas.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/2/22/Sinai_Desert%2C_Egypt%2C_expansive_vistas.jpg","w":3072,"h":2048,"by":"Vyacheslav Argenberg","lic":"CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:Sinai_Desert,_Egypt,_expansive_vistas.jpg","cap":"The Sinai desert"},"lat":null,"lng":null,"ar":null,"plan":"3:30 PM","title":"Sinai desert ATV safari & Bedouin dinner","timeNote":"Pickup 3:00–3:30 PM"},{"type":"stop","id":"dec30-old-market-al-sahaba-mosque","kind":"mosque","short":"Old Market","name":"Old Market & Al-Sahaba Mosque","address":"El-Souk, Sharm El Sheikh","getTo":"Ask the safari to drop you at the Old Market on the way back. The mosque is lit up at night and the stalls stay open late.","recTime":"1.5–2 hours","hours":null,"history":"Al-Sahaba Mosque, a Mamluk-revival landmark that took 7 years to build, anchors the Old Market — best visited in the evening when lit and lively. Free entry; modest dress required, robes provided at the door.","history2":null,"more":null,"fact":"The market comes alive at night rather than midday — locals say the best browsing hours start after sunset.","photoTip":"The mosque's domes lit up at dusk from the market square.","mustTry":null,"tips":["Prices vary wildly between stalls; compare before buying.","Browse the stalls for spices and perfumes; bargain with a smile."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJa-E1Hy46UxQRRJIer96S6Qo","query":"Old Market & Al-Sahaba Mosque, Sharm El Sheikh, Egypt","primary":true},{"label":"Al-Sahaba Mosque","placeId":"ChIJSVTNrS86UxQRsvjUALKtRF0","query":"Al Sahaba Mosque Sharm El Sheikh"}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Al-Sahaba_Mosque_in_Sharm_El-Sheikh_%282%29.jpg/{w}px-Al-Sahaba_Mosque_in_Sharm_El-Sheikh_%282%29.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/c/c4/Al-Sahaba_Mosque_in_Sharm_El-Sheikh_%282%29.jpg","w":4320,"h":3240,"by":"Шухрат Саъдиев","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Al-Sahaba_Mosque_in_Sharm_El-Sheikh_(2).jpg","cap":""},"lat":27.86657,"lng":34.29521,"ar":"السوق القديم ومسجد الصحابة – شرم القديمة","plan":"9:00 PM","title":"Old Market & Al-Sahaba Mosque","timeNote":"Lit up after dark"},{"type":"stop","id":"dec30-naama-bay-soho-square-farsha-cafe","kind":"cafe","short":"Naama Bay","name":"Naama Bay — Soho Square & Farsha Cafe","address":"Naama Bay, Sharm El Sheikh","getTo":"Pick one area: Farsha Cafe is ~10 min away in Hadaba, Naama Bay ~15 min, Soho Square ~25 min north near the airport. They aren't walkable from each other.","recTime":"2+ hours","hours":null,"history":"Soho Square's dancing fountain and lively promenade make for an easy evening stroll; Farsha Mountain Lounge / Farsha Cafe (map: separate stop nearby) offers cliffside shisha and sunset views over the Red Sea.","history2":null,"more":null,"fact":null,"photoTip":"Soho Square's fountain lit up at night, shot from the upper walkway.","mustTry":null,"tips":["Staying in Nabq/Soho puts you ~10 min from the airport for tomorrow's early flight."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJ-SUwp5hJUxQR13GK4yhFy-Q","query":"Naama Bay, Sharm El Sheikh, Egypt","primary":true},{"label":"Farsha Cafe","placeId":"ChIJnSTrOz46UxQRUCvBd_dzKWU","query":"Farsha Cafe Sharm El Sheikh"}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Naama_Bay_R01.jpg/{w}px-Naama_Bay_R01.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/5/51/Naama_Bay_R01.jpg","w":3216,"h":2136,"by":"Marc Ryckaert","lic":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Naama_Bay_R01.jpg","cap":""},"lat":27.90528,"lng":34.32417,"ar":"خليج نعمة","plan":"10:00 PM","title":"Late evening: Farsha Cafe, Naama Bay or Soho Square","timeNote":null}],"transport":"Quick EgyptAir flight Cairo → Sharm El Sheikh (~1 hr), about $45–120 round trip (egyptair.com). Alternative from your draft: a private car down early in the morning (~6–7 hrs) and the 5 AM bus back, reaching Cairo around noon on Dec 31.","places":[{"label":"Cairo International Airport","placeId":"ChIJQU-oLggXWBQRhhPiUSGvZeA","query":"Cairo International Airport, Egypt"},{"label":"Sharm El Sheikh Airport","placeId":"ChIJ9dN6VgxJUxQRbe0t-lw5ydc","query":"Sharm El Sheikh Airport, Egypt"}],"hotelInfo":{"name":"Sharm El Sheikh hotel (not booked yet)","city":"Sharm El Sheikh","placeId":null,"query":"Naama Bay Sharm El Sheikh","phone":null,"note":"Pick a hotel near Naama Bay or Soho Square so the evening stops are close. Soho/Nabq is ~10 min from the airport, handy for the early flight back.","ar":"خليج نعمة – شرم الشيخ","lat":27.90528,"lng":34.32417,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Naama_Bay_R01.jpg/{w}px-Naama_Bay_R01.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/5/51/Naama_Bay_R01.jpg","w":3216,"h":2136,"by":"Marc Ryckaert","lic":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Naama_Bay_R01.jpg","cap":""}},"hero":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Ras_mohammed_coral_reef_landscape.jpg/{w}px-Ras_mohammed_coral_reef_landscape.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/f/f5/Ras_mohammed_coral_reef_landscape.jpg","w":3648,"h":2432,"by":"Sovernigo","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Ras_mohammed_coral_reef_landscape.jpg","cap":""},"pacing":"Fly in early. The cathedral is on the way from the airport, Ras Mohammed by boat in the morning, the Seascope from the Old Market's marina after lunch, the desert at sunset, then the Old Market lit up at night and a late evening at Farsha Cafe or Naama Bay.","saves":"Re-sequenced","optimized":["Heads-up fixed: Soho Square (north, near the airport) and Farsha Cafe (south, in Hadaba) aren't in Naama Bay. Pick one area for the evening.","From your draft: the Seascope sails from the marina next to the Old Market, right where the Ras Mohammed boats come back.","The cathedral moves to the drive in from the airport, and the Old Market and Al-Sahaba Mosque move to the evening, when they're lit up and busiest, 10 minutes from Farsha Cafe."]},{"id":"dec31","dow":"Thu","date":"Dec 31","full":"Thursday, December 31, 2026","city":"Cairo & Saqqara","region":"cairo","title":"Citadel, Saqqara & New Year's Eve at the Pyramids","hotel":"menaHouse","links":[{"label":"EgyptAir","url":"https://www.egyptair.com/"},{"label":"Uber","url":"https://www.uber.com/eg/en/"},{"label":"Careem","url":"https://www.careem.com/"}],"tip":"Saqqara is ~45 min from Islamic Cairo and taxis rarely wait there. Book a car and driver for the afternoon (hotel concierge or GetTransfer) so you have a ride back to Giza.","items":[{"type":"stop","id":"dec31-al-azhar-mosque-islamic-cairo","kind":"mosque","short":"Al-Azhar","name":"Al-Azhar Mosque (Islamic Cairo)","address":"Al-Azhar, Cairo","getTo":"Taxi/Uber from Cairo airport, ~25–30 min. It's the stop closest to the airport and the first to close, so start here.","recTime":"30–45 min","hours":null,"history":"Al-Azhar Mosque, founded 970 CE, is one of the oldest universities in the world still operating — a quick exterior/courtyard stop before heading to Saqqara.","history2":null,"more":"Founded by the Fatimids in 970 CE, a year after they founded Cairo itself. Its minarets come from different centuries, so the skyline above the courtyard reads like a timeline of Cairo's dynasties.","fact":"Al-Azhar has continuously issued Islamic scholarship for over a thousand years.","photoTip":"The courtyard arcades from the main gate looking inward.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJ9SH986JAWBQR6FIeS8dSZ2c","query":"Al-Azhar Mosque, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Courtyard_of_Al-Azhar_Mosque_Cairo_Egypt_2019_%286%29.jpg/{w}px-Courtyard_of_Al-Azhar_Mosque_Cairo_Egypt_2019_%286%29.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/a/aa/Courtyard_of_Al-Azhar_Mosque_Cairo_Egypt_2019_%286%29.jpg","w":4000,"h":3000,"by":"Radosław Botev","lic":"CC BY 3.0 pl","page":"https://commons.wikimedia.org/wiki/File:Courtyard_of_Al-Azhar_Mosque_Cairo_Egypt_2019_(6).jpg","cap":""},"lat":30.04573,"lng":31.2627,"ar":"الجامع الأزهر","plan":"9:00 AM","title":"Al-Azhar Mosque","timeNote":null},{"type":"stop","id":"dec31-the-citadel-of-saladin-alabaster-mosque-","kind":"fortress","short":"Citadel","name":"The Citadel of Saladin & Alabaster Mosque (Medieval and Ottoman landmark above Cairo)","address":"Salah Salem St, Cairo","getTo":"~10-min taxi south from Al-Azhar.","recTime":"1.5 hours","hours":"Closes at 5 PM — worth noting given how packed the rest of today is.","history":"Built by Saladin starting 1176 as a fortress against Crusader threats, later rebuilt and expanded by successive dynasties. The Alabaster Mosque (Muhammad Ali Mosque), completed 1848, holds the Tomb of Muhammad Ali and one of the best panoramic views of Cairo and the Pyramids in the city — the Grand Courtyard itself has a clocktower and twin minarets worth lingering on.","history2":null,"more":"The Muhammad Ali Mosque was modeled on the great Ottoman mosques of Istanbul. The brass clock tower in its courtyard was a gift from King Louis-Philippe of France in 1845, given in exchange for the Luxor Temple obelisk that now stands in Paris (you'll see the empty pedestal on Jan 1). The clock is said never to have kept time properly.","fact":"The Citadel served as Egypt's seat of government for nearly 700 years, until the mid-19th century.","photoTip":"The Grand Courtyard with its clocktower and twin minarets, shot from ground level looking straight up.","mustTry":null,"tips":["Ticket office takes cards only.","Shoes off inside the mosque; women should cover shoulders and hair."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJY-3CkKxAWBQRby736eSW2y8","query":"The Citadel of Saladin & Alabaster Mosque, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Muhammad_Ali_Mosque_1.jpg/{w}px-Muhammad_Ali_Mosque_1.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/f/fc/Muhammad_Ali_Mosque_1.jpg","w":2994,"h":2220,"by":"kallerna","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Muhammad_Ali_Mosque_1.jpg","cap":""},"lat":30.02861,"lng":31.25972,"ar":"قلعة صلاح الدين – مسجد محمد علي","plan":"9:50 AM","title":"Citadel of Saladin & the Alabaster Mosque","timeNote":null},{"type":"stop","id":"dec31-sultan-hassan-al-rifa-i-mosques","kind":"mosque","short":"Sultan Hassan","name":"Sultan Hassan & Al-Rifa'i Mosques","address":"Directly across from the Citadel, Cairo","getTo":"2-min walk down from the Citadel. From here, head straight south to Saqqara.","recTime":"45 min","hours":"Sultan Hassan 9 AM – 5 PM; Al-Rifa'i 9 AM – 4:30 PM","history":"Two of Cairo's grandest mosques facing each other — Sultan Hassan (1356) is one of the finest examples of Mamluk architecture anywhere.","history2":null,"more":"Sultan Hassan was built 1356–1363 as a mosque and a school for all four Sunni schools of law; its towering entrance portal is one of the tallest in Cairo. Al-Rifa'i, finished in 1912, holds the tombs of Khedive Ismail, King Farouk and Mohammad Reza Pahlavi, the last Shah of Iran. One shared ticket covers both.","fact":"Sultan Hassan Mosque's minaret was once among the tallest structures in medieval Cairo.","photoTip":"Shoot both mosques together from the middle of the street dividing them.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJdRfpCqxAWBQR5IwPTJC5xnQ","query":"Sultan Hassan & Al-Rifa'i Mosques, Egypt","primary":true},{"label":"Al-Rifa'i Mosque","placeId":"ChIJQzwG_6tAWBQRHeWM2htky-w","query":"Al-Rifai Mosque Cairo"}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/%D9%85%D8%B3%D8%AC%D8%AF%D9%89_%D8%A7%D9%84%D8%B1%D9%81%D8%A7%D8%B9%D9%89_%D9%88%D8%A7%D9%84%D8%B3%D9%84%D8%B7%D8%A7%D9%86_%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9.jpg/{w}px-%D9%85%D8%B3%D8%AC%D8%AF%D9%89_%D8%A7%D9%84%D8%B1%D9%81%D8%A7%D8%B9%D9%89_%D9%88%D8%A7%D9%84%D8%B3%D9%84%D8%B7%D8%A7%D9%86_%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/d/df/%D9%85%D8%B3%D8%AC%D8%AF%D9%89_%D8%A7%D9%84%D8%B1%D9%81%D8%A7%D8%B9%D9%89_%D9%88%D8%A7%D9%84%D8%B3%D9%84%D8%B7%D8%A7%D9%86_%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9.jpg","w":5369,"h":4043,"by":"Batoul Khalifa","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:%D9%85%D8%B3%D8%AC%D8%AF%D9%89_%D8%A7%D9%84%D8%B1%D9%81%D8%A7%D8%B9%D9%89_%D9%88%D8%A7%D9%84%D8%B3%D9%84%D8%B7%D8%A7%D9%86_%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9.jpg","cap":""},"lat":30.0319,"lng":31.2567,"ar":"مسجد السلطان حسن ومسجد الرفاعي","plan":"11:20 AM","title":"Sultan Hassan & Al-Rifa'i Mosques","timeNote":null},{"type":"lunch","text":"Grab-and-go on the drive south to Saqqara, so you're not starving at 4:30.","plan":"12:10 PM"},{"type":"section","title":"Saqqara","text":"Egypt's oldest royal necropolis, used for more than 3,000 years. The sub-sites below sit within a 10–15 minute walk or golf-cart ride of each other: move briskly, don't linger.","getTo":"~45-min drive south from Sultan Hassan. Use a car and driver who waits for you.","maps":[{"label":"Saqqara","placeId":"ChIJcyhKzdRLWBQRdu6uW0E2jOA","query":"Saqqara, Giza, Egypt"}],"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Saqqara_pyramid_ver_2.jpg/{w}px-Saqqara_pyramid_ver_2.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/2/2e/Saqqara_pyramid_ver_2.jpg","w":3036,"h":2024,"by":"Charles J. Sharp","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Saqqara_pyramid_ver_2.jpg","cap":""}},{"type":"stop","id":"dec31-imhotep-museum","kind":"museum","short":"Imhotep Museum","name":"Imhotep Museum","address":"Near the Saqqara entrance","getTo":"Right by the Saqqara entrance. See it first: it closes first, and the loop below starts here.","recTime":"20–30 min","hours":"8 AM – 4 PM","history":"A compact museum near the entrance, named for the Step Pyramid's architect, with finds from across the Saqqara necropolis.","history2":null,"more":null,"fact":"It includes a small reading room/library in addition to its artifact halls.","photoTip":null,"mustTry":null,"tips":["Saqqara's tombs can close at 4 PM in winter. If time is short, the must-sees are Djoser, the Serapeum and Mereruka."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJ60__JdVLWBQRWHzxbdaedPY","query":"Imhotep Museum, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Imhotep-Museum_%28Sakkara%29_02.jpg/{w}px-Imhotep-Museum_%28Sakkara%29_02.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/f/fd/Imhotep-Museum_%28Sakkara%29_02.jpg","w":4381,"h":3286,"by":"Olaf Tausch","lic":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Imhotep-Museum_(Sakkara)_02.jpg","cap":""},"lat":29.86944,"lng":31.22472,"ar":"متحف إمحوتب – سقارة","plan":"12:55 PM","title":"Imhotep Museum","timeNote":"At the entrance"},{"type":"stop","id":"dec31-step-pyramid-of-djoser","kind":"pyramid","short":"Djoser","name":"Step Pyramid of Djoser","address":"Saqqara","getTo":"Short walk from the museum to the Step Pyramid's colonnade entrance.","recTime":"45 min","hours":"Saqqara 8 AM – 4:30 PM","history":"Built c. 2670 BCE by architect Imhotep, the world's oldest large-scale stone monument, the template every later pyramid descended from. Imhotep was later deified as a god of medicine and wisdom.","history2":null,"more":"Imhotep stacked six mastaba-like layers of stone to reach about 62 m. Around it runs a 10.5 m enclosure wall with 14 false doors and one real entrance, and inside is the courtyard used for the king's jubilee festival, where he ran a ritual course to prove his strength.","fact":"It consists of six overlapping mastaba-like levels, rising about 62 meters.","photoTip":null,"mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJgVyyU9VLWBQRnfi--qd3xQg","query":"Step Pyramid of Djoser, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Sakkara_01.jpg/{w}px-Sakkara_01.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/6/6a/Sakkara_01.jpg","w":4315,"h":3232,"by":"Olaf Tausch","lic":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Sakkara_01.jpg","cap":""},"lat":29.87111,"lng":31.21667,"ar":"هرم زوسر المدرج – سقارة","plan":"1:25 PM","title":"Step Pyramid of Djoser","timeNote":null},{"type":"stop","id":"dec31-pyramid-of-unas","kind":"pyramid","short":"Unas","name":"Pyramid of Unas","address":"Saqqara","getTo":"~5-min walk from the southwest corner of Djoser's complex.","recTime":"20–30 min","hours":null,"history":"Modest from the outside, but the payoff is inside: its burial chamber holds some of the earliest known Pyramid Texts, carved funerary spells meant to guide the king into the afterlife — among the oldest religious writing in the world.","history2":null,"more":"Unas was the last king of the Fifth Dynasty (c. 2350 BCE). His burial chamber is the first known to carry the Pyramid Texts; you go down a short sloping passage, crouching for a few meters.","fact":"The chamber's ceiling is carved with a star pattern meant to represent the night sky.","photoTip":null,"mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJAQAAk9RLWBQR-xj8Swl-BdY","query":"Pyramid of Unas, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Pyramid_Texts_in_Unas%E2%80%99_Pyramid_2017.jpg/{w}px-Pyramid_Texts_in_Unas%E2%80%99_Pyramid_2017.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/b/bc/Pyramid_Texts_in_Unas%E2%80%99_Pyramid_2017.jpg","w":2560,"h":1920,"by":"Aidan McRae Thomson","lic":"CC BY-SA 2.0","page":"https://commons.wikimedia.org/wiki/File:Pyramid_Texts_in_Unas%E2%80%99_Pyramid_2017.jpg","cap":"Pyramid Texts inside Unas' pyramid"},"lat":29.86833,"lng":31.21472,"ar":"هرم أوناس – سقارة","plan":"2:10 PM","title":"Pyramid of Unas","timeNote":null},{"type":"stop","id":"dec31-serapeum-of-saqqara","kind":"tomb","short":"Serapeum","name":"Serapeum of Saqqara","address":"Saqqara","getTo":"Short drive or golf-cart ride northwest (~1 km).","recTime":"30 min","hours":null,"history":"Underground labyrinth holding monolithic granite sarcophagi for the sacred Apis bulls — some boxes weigh up to 70 tons, with lids alone weighing 30 tons.","history2":null,"more":"Auguste Mariette rediscovered the Serapeum in 1850–51 after spotting a sphinx's head poking out of the sand. Its 24 sarcophagi were for the Apis bulls, sacred animals believed to be living forms of the god Ptah. Separate ticket.","fact":"How ancient workers maneuvered these massive sarcophagi into such narrow tunnels remains debated.","photoTip":null,"mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJ2fMlzX1JWBQRj1Xf6BHOJJ0","query":"Serapeum of Saqqara, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/Serapeum_in_Saqqara_6.jpg/{w}px-Serapeum_in_Saqqara_6.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/9/9b/Serapeum_in_Saqqara_6.jpg","w":4608,"h":3456,"by":"Leon petrosyan","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Serapeum_in_Saqqara_6.jpg","cap":""},"lat":29.87472,"lng":31.21242,"ar":"السرابيوم – سقارة","plan":"2:35 PM","title":"Serapeum of Saqqara","timeNote":null},{"type":"stop","id":"dec31-mastaba-of-ti","kind":"tomb","short":"Ti","name":"Mastaba of Ti","address":"Saqqara","getTo":"A few minutes' walk from the Serapeum.","recTime":"20–30 min","hours":null,"history":"Widely considered the most artistically accomplished private tomb at Saqqara — vivid, detailed reliefs of agriculture, boatbuilding, and daily life, often cited as some of the finest Old Kingdom relief carving anywhere.","history2":null,"more":"Ti was a Fifth Dynasty official who oversaw royal pyramids and sun temples. Mariette uncovered the tomb in 1865. Separate ticket.","fact":"Ti served as a royal hairdresser and manicurist before rising to a senior court position.","photoTip":null,"mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJQZIsVABJWBQRgY4g1tV4W5U","query":"Mastaba of Ti, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Mastaba_de_Ti_-_mula_terca.JPG/{w}px-Mastaba_de_Ti_-_mula_terca.JPG","o":"https://upload.wikimedia.org/wikipedia/commons/f/f8/Mastaba_de_Ti_-_mula_terca.JPG","w":1280,"h":960,"by":"Hispalois","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Mastaba_de_Ti_-_mula_terca.JPG","cap":"Relief in the Mastaba of Ti"},"lat":29.87725,"lng":31.21175,"ar":"مصطبة تي – سقارة","plan":"3:10 PM","title":"Mastaba of Ti","timeNote":null},{"type":"stop","id":"dec31-mastaba-of-mereruka","kind":"tomb","short":"Mereruka","name":"Mastaba of Mereruka","address":"Saqqara","getTo":"Short drive east to the Teti cemetery, on the way back to the exit.","recTime":"30 min","hours":null,"history":"The largest non-royal tomb at Saqqara — over 30 rooms belonging to a vizier under Pepi I, with Old Kingdom reliefs of daily life (hunting, farming, craftsmen at work) that are better preserved than most royal tombs nearby.","history2":null,"more":"Mereruka was vizier to King Teti and married the king's daughter. A life-size statue of him steps out of a false door at the end of the main pillared hall. Separate ticket.","fact":"Some reliefs still show visible original paint pigment despite being over 4,000 years old.","photoTip":null,"mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJuZPT4YNJWBQRv4w-HVnz2r0","query":"Mastaba of Mereruka, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Estatua_de_Mereruka_%28Saqqara%29.jpg/{w}px-Estatua_de_Mereruka_%28Saqqara%29.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/8/80/Estatua_de_Mereruka_%28Saqqara%29.jpg","w":3011,"h":4013,"by":"Jl FilpoC","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Estatua_de_Mereruka_(Saqqara).jpg","cap":"Statue of Mereruka in his tomb"},"lat":29.8758,"lng":31.2212,"ar":"مصطبة مريروكا – سقارة","plan":"3:35 PM","title":"Mastaba of Mereruka","timeNote":null},{"type":"stop","id":"dec31-pyramid-of-teti","kind":"pyramid","short":"Teti","name":"Pyramid of Teti","address":"Saqqara","getTo":"2-min walk; it sits right beside Mereruka's tomb. Exit is close by.","recTime":"20 min","hours":null,"history":"One of the few pyramids you can crawl inside; funerary texts and a star-patterned ceiling line the burial chamber.","history2":null,"more":"Teti was the first king of the Sixth Dynasty (c. 2345 BCE). It is right next to Mereruka's tomb, so do the two together.","fact":"Dating to the Sixth Dynasty (c. 2330 BCE), its interior Pyramid Texts were only rediscovered in 1881.","photoTip":null,"mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJqdLlHYRJWBQRKb7N2XDymRs","query":"Pyramid of Teti, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Pyramid_of_Teti_2010.jpg/{w}px-Pyramid_of_Teti_2010.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/d/db/Pyramid_of_Teti_2010.jpg","w":4272,"h":2848,"by":"Wknight94","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Pyramid_of_Teti_2010.jpg","cap":""},"lat":29.87528,"lng":31.22161,"ar":"هرم تتي – سقارة","plan":"4:05 PM","title":"Pyramid of Teti","timeNote":"Skip if gates are closing"},{"type":"stop","id":"dec31-nye","kind":"party","name":"New Year's Eve at the Pyramids","stampable":true,"short":"NYE 2027","address":"Giza Plateau, next to the Marriott Mena House","getTo":"Back to the Mena House to change (~45–60 min from Saqqara); the gala is a short walk from the hotel.","history":"Ring in 2027 at the foot of the Great Pyramid. The Giza gala is held on the plateau with the pyramids lit up behind the stage, and the Mena House puts you a short walk from the venue and your bed.","tips":["Event operators change each year. Search \"Pyramids New Year's Eve gala 2027\"; tickets usually go on sale October–November.","Bring a warm layer: Giza nights in late December drop to about 10°C."],"maps":[{"label":"Marriott Mena House","placeId":"ChIJJTcLq4VFWBQRss6Y4MGJSVw","query":"Marriott Mena House Cairo"}],"bookings":[{"label":"Find the NYE gala on GetYourGuide","url":"https://www.getyourguide.com/"},{"label":"or Viator","url":"https://www.viator.com/"}],"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Giza_Pyramids_9.JPG/{w}px-Giza_Pyramids_9.JPG","o":"https://upload.wikimedia.org/wikipedia/commons/a/ac/Giza_Pyramids_9.JPG","w":4272,"h":2848,"by":"Waelfouda","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Giza_Pyramids_9.JPG","cap":"The pyramids lit at night"},"lat":29.98556,"lng":31.13278,"ar":"فندق ماريوت مينا هاوس – الهرم","plan":"8:00 PM","title":"New Year's Eve at the Pyramids","timeNote":"Gala night"}],"transport":"Early EgyptAir flight Sharm → Cairo (first departures ~7am), landing Cairo ~8am.","walking":"~3 km across the Citadel/Islamic Cairo stops, plus a Saqqara walking circuit of ~2 km","pacing":"The most packed day of the trip, after an early flight. Route: Al-Azhar → Citadel → Sultan Hassan → south to Saqqara. The Citadel closes at 5 PM and Saqqara's tombs around 4 PM in winter. Coming back from Sharm by the 5 AM bus instead (in Cairo around noon)? Skip Al-Azhar and the Citadel and go from Sultan Hassan straight to Saqqara.","places":[{"label":"Sharm El Sheikh Airport","placeId":"ChIJ9dN6VgxJUxQRbe0t-lw5ydc","query":"Sharm El Sheikh Airport, Egypt"},{"label":"Cairo International Airport","placeId":"ChIJQU-oLggXWBQRhhPiUSGvZeA","query":"Cairo International Airport, Egypt"}],"hotelInfo":{"name":"Marriott Mena House","city":"Giza","placeId":"ChIJJTcLq4VFWBQRss6Y4MGJSVw","query":"Marriott Mena House Cairo","phone":"+20 2 33773222","note":"Former royal hunting lodge (1869) at the foot of the Pyramids. Ask for a Pyramid View room.","ar":"فندق ماريوت مينا هاوس – الهرم","lat":29.98556,"lng":31.13278,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/The_Oberoi_-_Mena_House%2C_Egypt.jpg/{w}px-The_Oberoi_-_Mena_House%2C_Egypt.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/4/4e/The_Oberoi_-_Mena_House%2C_Egypt.jpg","w":1536,"h":1024,"by":"Paul Mannix","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:The_Oberoi_-_Mena_House,_Egypt.jpg","cap":""}},"hero":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Saqqara_pyramid_ver_2.jpg/{w}px-Saqqara_pyramid_ver_2.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/2/2e/Saqqara_pyramid_ver_2.jpg","w":3036,"h":2024,"by":"Charles J. Sharp","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Saqqara_pyramid_ver_2.jpg","cap":""},"saves":"~45 min","optimized":["Al-Azhar first: it's closest to the airport and closes earliest. Then the Citadel and Sultan Hassan, then straight south to Saqqara. No more doubling back across central Cairo (~20 min).","Inside Saqqara: the Imhotep Museum by the entrance comes first (the old plan left it for last, after it may have closed), then one loop: Djoser → Unas → Serapeum → Ti → Mereruka → Teti. About 2 km less zig-zagging (~25 min).","Lunch moved to the drive south, instead of 4:30 PM."]},{"id":"jan1","dow":"Fri","date":"Jan 1","full":"Friday, January 1, 2027","city":"Luxor","region":"luxor","title":"Luxor East Bank","hotel":"sonesta","links":[{"label":"EgyptAir","url":"https://www.egyptair.com/"},{"label":"Abela sleeper train","url":"https://www.abelatrains.com/"},{"label":"Careem (Luxor taxis)","url":"https://www.careem.com/"}],"endNote":"Taxi back to the hotel after the show, ~10 min.","items":[{"type":"stop","id":"jan1-karnak-temple-complex","kind":"temple","short":"Karnak","name":"Karnak Temple Complex","address":"Karnak, Luxor","getTo":"Taxi/Careem from Luxor airport, ~15–20 min.","recTime":"2.5–3 hours","hours":"6 AM – 5 PM","history":"Built over ~2,000 years by more than 30 pharaohs, one of the largest religious complexes ever constructed. The Great Hypostyle Hall alone has 134 columns, some reaching 21 meters.","history2":null,"more":"The ancient name was Ipet-isut, \"the most select of places.\" The Great Hypostyle Hall, mostly built under Seti I and Ramesses II, covers about 5,000 m² — enough to hold Notre-Dame cathedral. Walk to the Sacred Lake, where priests purified themselves before rituals, and find the giant granite scarab beside it.","fact":"Karnak remained ancient Egypt's most important active temple for nearly two millennia — longer than any other religious site in history.","photoTip":"Shoot down the hypostyle hall's central row at a low angle to exaggerate the column height.","mustTry":null,"tips":["Hire an official guide at the entrance if you want the reliefs explained."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJzcD-KJIVSRQR2FnCCMDoGsc","query":"Karnak Temple Complex, Luxor, Egypt","primary":true}],"bookings":[{"label":"Evening Sound and Light Show — soundandlight.show (temple tickets: egymonuments.com)","url":"https://soundandlight.show/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Luxor%2C_Egypt%2C_Karnak.jpg/{w}px-Luxor%2C_Egypt%2C_Karnak.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/8/85/Luxor%2C_Egypt%2C_Karnak.jpg","w":3072,"h":2048,"by":"Vyacheslav Argenberg","lic":"CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:Luxor,_Egypt,_Karnak.jpg","cap":""},"lat":25.71833,"lng":32.65833,"ar":"معبد الكرنك","plan":"11:00 AM","title":"Karnak Temple","timeNote":null},{"type":"stop","id":"jan1-avenue-of-sphinxes","kind":"statue","short":"Sphinx Avenue","name":"Avenue of Sphinxes","address":"Luxor City","getTo":"Walk the full path, Karnak → Luxor Temple, 30–45 min.","recTime":"30–45 min","hours":"6 AM – 5 PM","history":"Over 1,050 ram- and human-headed sphinx statues once lined this 2.7km processional route, used for the annual Opet Festival. Fully excavated and reopened in 2021 after 30+ years of restoration.","history2":null,"more":"The avenue runs 2.7 km. The ram-headed sphinxes near Karnak stand for the god Amun; the human-headed ones nearer Luxor Temple carry the face of Nectanebo I (c. 380 BCE), who rebuilt the final stretch. Most of the middle section lost its statues long ago.","fact":"It's also known locally as El-Kebash Road, or the \"King's Festivities Road.\"","photoTip":"Sunset through the surviving sphinx rows near either temple entrance.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJ87lTkLAVSRQRwlKn9mhd1LU","query":"Avenue of Sphinxes, Luxor, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/1300_Sphinxen_s%C3%A4umten_urspr%C3%BCnglich_die_Allee._02.jpg/{w}px-1300_Sphinxen_s%C3%A4umten_urspr%C3%BCnglich_die_Allee._02.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/3/37/1300_Sphinxen_s%C3%A4umten_urspr%C3%BCnglich_die_Allee._02.jpg","w":5906,"h":3121,"by":"Holger Uwe Schmitt","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:1300_Sphinxen_s%C3%A4umten_urspr%C3%BCnglich_die_Allee._02.jpg","cap":""},"lat":25.708,"lng":32.648,"ar":"طريق الكباش","plan":"1:45 PM","title":"Avenue of Sphinxes","timeNote":null},{"type":"lunch","text":"Grab-and-go somewhere along the Avenue or near Luxor Temple.","plan":"2:30 PM"},{"type":"stop","id":"jan1-luxor-temple","kind":"temple","short":"Luxor Temple","name":"Luxor Temple","address":"Luxor City","getTo":"End of the Avenue walk, same precinct.","recTime":"1.5–2 hours","hours":"6 AM – 8 PM","history":"Built mainly under Amenhotep III and Ramesses II, in continuous use for millennia — a 13th-century mosque (Abu al-Haggag) still sits active within its walls today. One of its original obelisks now stands in Paris's Place de la Concorde.","history2":null,"more":"Built mostly by Amenhotep III (c. 1390–1352 BCE) and Ramesses II. Alexander the Great added a granite shrine inside, and in Roman times part of the temple became a military chapel; its painted plaster saints are still on the walls. At the entrance, look for the empty base beside the surviving obelisk: its twin is in the Place de la Concorde in Paris.","fact":"Unlike most Egyptian temple sites, Luxor Temple stays open until 8–9pm, making it one of the few you can genuinely plan around sunset.","photoTip":"Best at night — the lighting after dark is dramatic against the columns.","mustTry":null,"tips":["Ticket office takes cards only."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJYd_aHsQVSRQRgX1sNFyJk3Y","query":"Luxor Temple, Luxor, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Templo_de_Luxor%2C_Luxor%2C_Egipto%2C_2022-04-01%2C_DD_40.jpg/{w}px-Templo_de_Luxor%2C_Luxor%2C_Egipto%2C_2022-04-01%2C_DD_40.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/d/d6/Templo_de_Luxor%2C_Luxor%2C_Egipto%2C_2022-04-01%2C_DD_40.jpg","w":8303,"h":5535,"by":"Diego Delso","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Templo_de_Luxor,_Luxor,_Egipto,_2022-04-01,_DD_40.jpg","cap":""},"lat":25.7,"lng":32.63917,"ar":"معبد الأقصر","plan":"3:00 PM","title":"Luxor Temple","timeNote":"Stay for sunset ~5:20"},{"type":"stop","id":"jan1-luxor-museum","kind":"museum","short":"Luxor Museum","name":"Luxor Museum","address":"Corniche Al Nile, Luxor City","getTo":"~5-min taxi from Luxor Temple.","recTime":"1–1.5 hours","hours":"9 AM – 2 PM and 5 – 8 PM","history":"Smaller and better curated than Cairo's old museum — strong Tutankhamun, Ramesses II, Hatshepsut, and Amenhotep III sections, with far fewer crowds.","history2":null,"more":"Opened in 1975, it holds the \"Luxor Cachette\": statues buried under Luxor Temple's courtyard in antiquity and found in 1989. Two royal mummies are displayed, believed to be Ahmose I and Ramesses I.","fact":"Confirm Jan 1 opening hours directly — public holidays sometimes shift the museum's schedule.","photoTip":null,"mustTry":null,"tips":["Plan for the 5–8 PM evening session; it's closed mid-afternoon."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJYd_aHsQVSRQRJJBTvfwQ07s","query":"Luxor Museum, Luxor, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Luxor_Museum_2010.jpg/{w}px-Luxor_Museum_2010.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/4/4c/Luxor_Museum_2010.jpg","w":2592,"h":1944,"by":"Michiel1972","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Luxor_Museum_2010.jpg","cap":""},"lat":25.70772,"lng":32.64449,"ar":"متحف الأقصر – الكورنيش","plan":"5:00 PM","title":"Luxor Museum","timeNote":"Reopens 5 PM"},{"type":"dinner","id":"jan1-sofra-restaurant-cafe","kind":"food","short":"Sofra","name":"Sofra Restaurant & Cafe","address":"Luxor City (reservation required)","getTo":"~10-min taxi from the museum. Dine early so you make the Karnak show.","recTime":null,"hours":null,"history":"Set in a restored 1930s Egyptian house, consistently rated the best traditional Egyptian cooking in Luxor.","history2":null,"more":null,"fact":null,"photoTip":null,"mustTry":"Stuffed pigeon, or the mezze plate.","tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJWWnJ58wVSRQRCeDEsneqVas","query":"Sofra Restaurant & Cafe, Luxor, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Hamam_mahshi.jpg/{w}px-Hamam_mahshi.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/f/f2/Hamam_mahshi.jpg","w":2048,"h":1536,"by":"medea_material","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Hamam_mahshi.jpg","cap":"Hamam mahshi (stuffed pigeon)"},"lat":25.69489,"lng":32.64226,"ar":"مطعم سفرة – الأقصر","plan":"6:30 PM","title":"Sofra","timeNote":"Early dinner before the show"},{"type":"stop","kind":"temple","short":"Karnak by night","name":"Karnak Sound & Light Show","photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/Sound_and_Light_show_in_Karnak_Temple_2.JPG/{w}px-Sound_and_Light_show_in_Karnak_Temple_2.JPG","o":"https://upload.wikimedia.org/wikipedia/commons/b/ba/Sound_and_Light_show_in_Karnak_Temple_2.JPG","w":4928,"h":3264,"by":"OmarShawki","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Sound_and_Light_show_in_Karnak_Temple_2.JPG","cap":""},"lat":25.71833,"lng":32.65833,"ar":"معبد الكرنك – عرض الصوت والضوء","plan":"8:00 PM","timeNote":"English slot rotates; confirm","address":"Karnak Temple, Luxor","getTo":"~10-min taxi from Sofra. Don't walk the Avenue of Sphinxes at night; it often closes after 5 PM.","recTime":"1.5 hours","hours":"Nightly in several languages; in winter the English show is often at 6:30, 7:45 or 9 PM","history":"Egypt's sound and light shows began at Giza in 1961, and Karnak's is the most immersive: you walk through the temple in the dark, past the ram-headed sphinxes, through the first pylon and into the floodlit Hypostyle Hall, while the narration tells the story of Thebes and its pharaohs.","more":"The walk ends at a grandstand beside the Sacred Lake, where priests purified themselves before rituals, for the finale over the whole illuminated complex.","fact":"Karnak's ancient name, Ipet-isut, means \"the most selected of places\".","photoTip":"Use night mode and brace your phone on a column or railing; tripods are often refused.","mustTry":null,"tips":["Book at soundandlight.show and check which slot is in English on Friday, Jan 1.","If English is the 6:30 PM show, swap: show first, then Sofra.","Bring a layer; January nights get cool."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJzcD-KJIVSRQR2FnCCMDoGsc","query":"Karnak Temple Complex, Luxor, Egypt","primary":true}],"bookings":[{"label":"Karnak Sound and Light tickets — soundandlight.show","url":"https://soundandlight.show/"}],"stampable":true,"id":"jan1-karnak-sound-and-light","title":"Karnak Sound & Light Show"}],"transport":"Short ~1hr EgyptAir flight Cairo → Luxor (egyptair.com) — gets you to Luxor mid-morning rather than losing the day to a 9–11 hr daytime train. Alternative if you'd rather sleep through the transfer: Abela overnight sleeper, abelatrains.com, departs Bashtil.","walking":"~5 km, flat","pacing":"Karnak in the late morning, the Avenue of Sphinxes on foot (before it closes at 5), Luxor Temple into sunset, the Luxor Museum when it reopens at 5 PM, an early dinner at Sofra, then Karnak again by night for the Sound & Light show.","places":[{"label":"Cairo International Airport","placeId":"ChIJQU-oLggXWBQRhhPiUSGvZeA","query":"Cairo International Airport, Egypt"},{"label":"Luxor Airport","placeId":"ChIJOa8Nc9oUSRQRUJ3lcV9sa50","query":"Luxor Airport, Egypt"}],"hotelInfo":{"name":"Sonesta St. George","city":"Luxor","placeId":"ChIJk-IqHikUSRQRT8QknuYzu6E","query":"Sonesta St. George Hotel Luxor","phone":"+20 95 2382575","note":"Central on the Corniche, Nile-view rooftop pool. Splurge alternative: Sofitel Winter Palace (1886).","ar":"فندق سونستا سانت جورج – كورنيش النيل، الأقصر","lat":25.68752,"lng":32.63088,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Luxor_Sonesta_01.JPG/{w}px-Luxor_Sonesta_01.JPG","o":"https://upload.wikimedia.org/wikipedia/commons/c/c7/Luxor_Sonesta_01.JPG","w":4197,"h":3153,"by":"Olaf Tausch","lic":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Luxor_Sonesta_01.JPG","cap":""}},"hero":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Templo_de_Karnak%2C_Luxor%2C_Egipto%2C_2022-04-03%2C_DD_155.jpg/{w}px-Templo_de_Karnak%2C_Luxor%2C_Egipto%2C_2022-04-03%2C_DD_155.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/3/3d/Templo_de_Karnak%2C_Luxor%2C_Egipto%2C_2022-04-03%2C_DD_155.jpg","w":8060,"h":5373,"by":"Diego Delso","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Templo_de_Karnak,_Luxor,_Egipto,_2022-04-03,_DD_155.jpg","cap":""},"saves":"Clash fixed","optimized":["Times set so the Luxor Museum falls in its evening session (it's closed 2–5 PM) and Luxor Temple glows at sunset.","Dinner at Sofra moved to 6:30 so it no longer clashes with the 8 PM Karnak Sound & Light show from your draft."]},{"id":"jan2","dow":"Sat","date":"Jan 2","full":"Saturday, January 2, 2027","city":"Luxor","region":"luxor","title":"Luxor West Bank","hotel":"sonesta","links":[{"label":"Hot air balloon (Viator)","url":"https://www.viator.com/"},{"label":"Car & driver (GetTransfer)","url":"https://gettransfer.com/"}],"tip":"The West Bank sites are spread over ~10 km. Hire a car and driver for the day (hotel concierge or GetTransfer); taxis don't wait at the sites. Time-saver: have the driver meet you at the balloon company's West Bank landing instead of the hotel.","items":[{"type":"stop","id":"jan2-hot-air-balloon-over-the-west-bank","kind":"balloon","short":"Balloon","name":"Hot Air Balloon over the West Bank","address":"Theban Necropolis, Luxor West Bank","getTo":"Hotel pickup included.","recTime":"3 hours including transfers","hours":null,"history":"Floating over the Theban necropolis at sunrise is the best orientation view of the West Bank you'll get all day.","history2":null,"more":"Balloon flights are weather-dependent and operators cancel when wind is too strong. Booking the first full day in Luxor gives you a backup morning. Ask whether the price includes hotel pickup, breakfast and the flight certificate.","fact":null,"photoTip":"Wide shots of the Valley of the Kings from altitude just after sunrise.","mustTry":null,"tips":["Pickup is often around 4:30 AM.","Dress in layers; desert mornings in January are cold."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":null,"query":"Theban Necropolis, Luxor West Bank, Egypt","primary":true}],"bookings":[{"label":"Magic Horizon or Sindbad Balloons (long-running Luxor operators) — book via Viator or GetYourGuide. Breakfast usually included.","url":"https://www.viator.com"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Sunrise_over_Luxor%2C_Egypt_%2853723505946%29.jpg/{w}px-Sunrise_over_Luxor%2C_Egypt_%2853723505946%29.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/2/2f/Sunrise_over_Luxor%2C_Egypt_%2853723505946%29.jpg","w":6016,"h":4016,"by":"Mustang Joe","lic":"CC0","page":"https://commons.wikimedia.org/wiki/File:Sunrise_over_Luxor,_Egypt_(53723505946).jpg","cap":"Sunrise over Luxor"},"lat":null,"lng":null,"ar":null,"plan":"5:00 AM","title":"Hot-air balloon over the West Bank","timeNote":"Hotel pickup ~5 AM"},{"type":"stop","id":"jan2-valley-of-the-kings","kind":"tomb","short":"Valley of the Kings","name":"Valley of the Kings","address":"Luxor West Bank","getTo":"Have your driver meet you at the balloon company's West Bank landing (no trip back to the hotel), then ~20 min to the Valley.","recTime":"2–2.5 hours","hours":"6 AM – 5 PM","history":"65 tombs found so far, spanning roughly 1550–1070 BCE. Tutankhamun's tomb, found intact in 1922 by Howard Carter, remains famous precisely because nearly every other tomb here had been looted in antiquity.","history2":null,"more":"Tutankhamun's tomb is KV62, the 62nd found in the valley. The longest is Seti I's (KV17), reaching about 137 m into the hill with painted walls and ceilings throughout. The standard ticket covers three tombs; Tutankhamun, Seti I and Ramesses V/VI need extra tickets.","fact":"General admission covers 3 tombs; Tutankhamun's and a few others need a separate add-on ticket.","photoTip":"The valley's dramatic cliff backdrop from the entrance plaza, before you descend toward the tombs.","mustTry":null,"tips":["Photography rules change; ask at the ticket office.","Take the little tram from the visitor center to the tombs."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJ1_7etYo9SRQR2qnjovbMj3E","query":"Valley of the Kings, Luxor, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Pharaoh_Seti_I%2C_detail_of_a_wall_painting_from_the_Tomb_of_Seti_I_at_the_Valley_of_the_Kings%2C_Western_Thebes%2C_Egypt._Neues_Museum.jpg/{w}px-Pharaoh_Seti_I%2C_detail_of_a_wall_painting_from_the_Tomb_of_Seti_I_at_the_Valley_of_the_Kings%2C_Western_Thebes%2C_Egypt._Neues_Museum.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/1/1a/Pharaoh_Seti_I%2C_detail_of_a_wall_painting_from_the_Tomb_of_Seti_I_at_the_Valley_of_the_Kings%2C_Western_Thebes%2C_Egypt._Neues_Museum.jpg","w":6016,"h":4016,"by":"Osama Shukir Muhammed Amin FRCP(Glasg)","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Pharaoh_Seti_I,_detail_of_a_wall_painting_from_the_Tomb_of_Seti_I_at_the_Valley_of_the_Kings,_Western_Thebes,_Egypt._Neues_Museum.jpg","cap":"Seti I, tomb painting in the Valley of the Kings"},"lat":25.74025,"lng":32.60236,"ar":"وادي الملوك – البر الغربي","plan":"8:15 AM","title":"Valley of the Kings","timeNote":null},{"type":"stop","id":"jan2-hatshepsut-s-mortuary-temple-deir-el-bah","kind":"temple","short":"Hatshepsut","name":"Hatshepsut's Mortuary Temple, Deir el-Bahari","address":"Al Qarna, Luxor West Bank","getTo":"~10-min drive from the Valley of the Kings.","recTime":"1–1.5 hours","hours":"6 AM – 5 PM","history":"Designed by Hatshepsut's architect Senenmut c. 1470 BCE — a terraced temple built directly into a cliff face, one of ancient Egypt's most architecturally daring designs. Her successor Thutmose III later had many of her images defaced.","history2":null,"more":"Its ancient name was Djeser-Djeseru, \"Holy of Holies.\" Reliefs on the middle terrace record her trading expedition to the land of Punt, bringing back incense trees, ebony and exotic animals.","fact":"Hatshepsut was one of very few women to rule Egypt as a full pharaoh, not merely a queen consort.","photoTip":"The terraces framed symmetrically against the cliff face, shot from the temple's forecourt.","mustTry":null,"tips":[],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJ3ae_xxgWSRQR07VjFXrhHwM","query":"Hatshepsut's Mortuary Temple, Deir el-Bahari, Luxor, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Templo_funerario_de_Hatshepsut%2C_Valle_de_las_Reyes%2C_Luxor%2C_Egipto%2C_2022-04-03%2C_DD_118.jpg/{w}px-Templo_funerario_de_Hatshepsut%2C_Valle_de_las_Reyes%2C_Luxor%2C_Egipto%2C_2022-04-03%2C_DD_118.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/4/47/Templo_funerario_de_Hatshepsut%2C_Valle_de_las_Reyes%2C_Luxor%2C_Egipto%2C_2022-04-03%2C_DD_118.jpg","w":8119,"h":5183,"by":"Diego Delso","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Templo_funerario_de_Hatshepsut,_Valle_de_las_Reyes,_Luxor,_Egipto,_2022-04-03,_DD_118.jpg","cap":""},"lat":25.73806,"lng":32.60694,"ar":"معبد حتشبسوت – الدير البحري","plan":"10:45 AM","title":"Temple of Hatshepsut, Deir el-Bahari","timeNote":null},{"type":"stop","id":"jan2-tombs-of-the-nobles","kind":"tomb","short":"Nobles' Tombs","name":"Tombs of the Nobles","address":"Al Qarna, Luxor West Bank","getTo":"~5-min drive from Hatshepsut's temple.","recTime":"45 min – 1 hour","hours":"8 AM – 6 PM","history":"Smaller, less-visited tombs with vivid scenes of daily life rather than royal ritual — agriculture, banquets, music, craftwork — a good contrast after the grander sites.","history2":null,"more":null,"fact":"Tombs like those of Rekhmire, Menna, and Ramose are considered masterpieces of color and detail distinct from royal tomb art.","photoTip":null,"mustTry":null,"tips":["Tickets are sold per group of tombs; Rekhmire, Sennefer, Menna and Ramose are the best.","Guardians unlock tombs and expect a small tip."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJCQP7HxcWSRQRQSPgBvXwjvg","query":"Tombs of the Nobles, Luxor, Egypt","primary":true}],"bookings":[],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Reliefs_of_a_Procession_from_the_Tomb_of_Ramose_TT55.jpg/{w}px-Reliefs_of_a_Procession_from_the_Tomb_of_Ramose_TT55.jpg","o":"https://upload.wikimedia.org/wikipedia/commons/f/fb/Reliefs_of_a_Procession_from_the_Tomb_of_Ramose_TT55.jpg","w":3615,"h":1886,"by":"Debborah Donnelly or https://www.debborahdonnelly.ca/","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Reliefs_of_a_Procession_from_the_Tomb_of_Ramose_TT55.jpg","cap":"Tomb of Ramose, Tombs of the Nobles"},"lat":25.73302,"lng":32.6078,"ar":"مقابر النبلاء – شيخ عبد القرنة","plan":"12:15 PM","title":"Tombs of the Nobles","timeNote":null},{"type":"stop","id":"jan2-medinet-habu","kind":"temple","short":"Medinet Habu","name":"Medinet Habu","address":"Al Bairat, Luxor West Bank","getTo":"~15-min drive south from the Tombs of the Nobles.","recTime":"1 hour","hours":"6 AM – 5 PM","history":"The best-preserved mortuary temple in Egypt, built for Ramses III — less crowded than Karnak but just as impressive in its intact reliefs.","history2":null,"more":"The outer walls show the earliest detailed record of a naval battle: Ramesses III defeating the \"Sea Peoples\" around 1175 BCE. Later, a Coptic town called Djeme grew up inside the walls.","fact":"Many of its original wall colors are still vividly visible.","photoTip":null,"mustTry":null,"tips":["The ticket office is far away; buy online at egymonuments.com or scan the QR code at the gate."],"notes":[],"maps":[{"label":"Open in Google Maps","placeId":"ChIJj-PU30MWSRQRkdX6khgE3ds","query":"Medinet Habu, Luxor, Egypt","primary":true}],"bookings":[{"label":"Official e-tickets — egymonuments.com","url":"https://egymonuments.com/"}],"stampable":true,"photo":{"t":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Me
